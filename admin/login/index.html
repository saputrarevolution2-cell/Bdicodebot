<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Login — PasTele</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"><style>html,body{margin:0;min-height:100%;font-family:Inter,sans-serif;background:#f5f7fb;color:#172033}body{display:grid;place-items:center;min-height:100vh;padding:20px;box-sizing:border-box}.card{width:min(430px,100%);background:#fff;border:1px solid #e6eaf0;border-radius:22px;padding:30px;box-shadow:0 20px 60px rgba(20,30,50,.1)}.brand{font-weight:800;font-size:24px;margin-bottom:6px}.sub{color:#687386;margin:0 0 24px}.badge{display:inline-flex;padding:7px 10px;border-radius:999px;background:#eef4ff;color:#2563eb;font-size:12px;font-weight:700;margin-bottom:16px}.field{margin:14px 0}.field label{display:block;font-size:13px;font-weight:700;margin-bottom:7px}.field input{width:100%;box-sizing:border-box;padding:13px 14px;border:1px solid #dbe1ea;border-radius:12px;font:inherit;outline:none}.field input:focus{border-color:#2563eb;box-shadow:0 0 0 3px rgba(37,99,235,.1)}button{width:100%;border:0;border-radius:12px;padding:13px 16px;background:#2563eb;color:white;font:700 14px Inter;cursor:pointer;margin-top:8px}button:disabled{opacity:.6;cursor:not-allowed}.msg{margin-top:14px;padding:11px 13px;border-radius:11px;font-size:13px;display:none}.msg.show{display:block}.msg.error{background:#fff1f2;color:#be123c}.msg.ok{background:#ecfdf5;color:#047857}.hint{font-size:12px;color:#7a8494;margin-top:18px;line-height:1.5}</style></head><body><main class="card"><div class="badge">ADMINISTRATOR ONLY</div><div class="brand">PasTele Admin</div><p class="sub">Login khusus administrator.</p><form id="form"><div class="field"><label for="username">Username Admin</label><input id="username" value="admin" autocomplete="username" autocapitalize="none"
