<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reset Password — TeleCod</title><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"><link rel="stylesheet" href="assets/base.css"><link rel="stylesheet" href="assets/theme.css"><link rel="stylesheet" href="premium.css"></head><body><main class="auth-layout"><div class="auth-card auth-card-premium"><a class="brand" href="index.html"><span class="brandmark"><i class="fa-brands fa-telegram"></i></span><span>Tele<span>Cod</span></span></a><h1>Reset Password</h1><p class="muted">Masukkan password baru untuk akunmu.</p><form id="f" class="form"><input id="p1" type="password" minlength="8" placeholder="Password baru" required><input id="p2" type="password" minlength="8" placeholder="Ulangi password" required><button class="btn primary" type="submit">Simpan Password</button></form></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="assets/config.js"></script><script src="assets/core.js"></script><script>const sb=supabase.createClient(TELECOD_CONFIG.SUPABASE_URL,TELECOD_CONFIG.SUPABASE_ANON_KEY);document.getElementById('f').onsubmit=async e=>{e.preventDefault();if(p1.value!==p2.value)return tcToast('Reset','Password tidak sama.','error');const {error}=await sb.auth.updateUser({password:p1.value});if(error)return tcToast('Reset',error.message,'error');tcToast('Reset','Password berhasil diubah.','success');setTimeout(()=>location.href='login.html',800)}</script></body></html>
