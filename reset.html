<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Reset Password • TeleCod</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css?v=20260825-clean">
  <script src="/js/fee.js"></script>
  <script src="/js/ui-state.js?v=20260825-clean"></script>
<link rel="stylesheet" href="/js/telecod-ui.css"><script src="/js/telecod-ui.js?v=20260825-clean"></script><link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
</head>
<body>
<main class="reset-page">
  <section class="reset-card">
    <a class="reset-brand" href="index.html">TELE<span>COD</span></a>
    <div class="reset-icon">🔐</div>
    <h1 data-r="title">Buat kata sandi baru</h1>
    <p data-r="sub">Masukkan kata sandi baru untuk akun TeleCod kamu.</p>
    <form id="resetForm">
      <label>
        <span data-r="password">Kata sandi baru</span>
        <div class="reset-input">
          <input id="newPassword" type="password" minlength="6" autocomplete="new-password" required>
          <button type="button" data-toggle="newPassword">👁</button>
        </div>
      </label>
      <label>
        <span data-r="confirm">Konfirmasi kata sandi</span>
        <div class="reset-input">
          <input id="confirmPassword" type="password" minlength="6" autocomplete="new-password" required>
          <button type="button" data-toggle="confirmPassword">👁</button>
        </div>
      </label>
      <button class="purple-btn reset-submit" type="submit" data-r="save">Simpan Kata Sandi</button>
    </form>
    <div id="resetToast" class="reset-toast" role="status" aria-live="polite"></div>
    <a class="reset-back" href="index.html" data-r="back">Kembali ke TeleCod</a>
  </section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script src="js/reset.js"></script>
</body>
</html>
