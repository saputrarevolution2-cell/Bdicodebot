<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Checkout — TeleCod</title><link rel="stylesheet" href="assets/app.css"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"></head><body><main class="auth-page"><div class="auth-card"><a class="brand" href="index.html"><span class="brandmark"><i class="fa-brands fa-telegram"></i></span><span>Tele<span>Cod</span></span></a><h1>Checkout</h1><div id="box">Loading...</div></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="assets/config.js"></script><script>const s=supabase.createClient(TELECOD_CONFIG.SUPABASE_URL,TELECOD_CONFIG.SUPABASE_ANON_KEY),id=new URLSearchParams(location.search).get("id");async function go(){let {data,error}=await s.from("orders").select("id,amount,status,products(title,description,price)").eq("id",id).single();if(error){box.innerHTML='<div class="error">'+error.message+'</div>';return}box.innerHTML=`<h2>${escapeHtml(data.products.title)}</h2><p>${escapeHtml(data.products.description||"")}</p><h2>${money(data.products.price)}</h2><p>Status order: <b>${data.status}</b></p><div class="error">Payment gateway belum dikonfigurasi. Hubungkan Edge Function payment provider Anda ke kolom payment_url/payment_reference agar pembayaran dapat dibuat dan diverifikasi otomatis.</div>`}go()</script><script src="assets/app.js"></script></body></html>
