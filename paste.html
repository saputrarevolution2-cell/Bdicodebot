<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PasteLink — TeleCod</title><link rel="stylesheet" href="assets/app.css"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"></head><body><header class="topbar"><div class="wrap nav"><a class="brand" href="index.html"><span class="brandmark"><i class="fa-brands fa-telegram"></i></span><span>Tele<span>Cod</span></span></a><div class="nav-actions"><a class="btn ghost" href="login.html">Login</a><a class="btn primary" href="register.html">Register</a></div></div></header><main class="section"><div class="wrap" style="max-width:850px"><div class="section-head"><div><span class="kicker">PASTELINK</span><h2>Buat & baca PasteLink</h2><p>Paste dapat dibuat tanpa login. Untuk membuat paste berbayar, pengguna harus login.</p></div></div><div class="auth-card" style="width:100%"><form class="form" id="pasteForm"><label>Title</label><input id="title" required maxlength="120"><label>Content</label><textarea id="content" rows="12" required></textarea><label>Visibility</label><select id="visibility"><option value="public">Public</option><option value="unlisted">Unlisted</option><option value="private">Private</option></select><label>Password (optional)</label><input id="pass" type="password"><button class="btn primary">Create PasteLink</button></form><div id="msg"></div></div></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="assets/config.js"></script><script>const s=supabase.createClient(TELECOD_CONFIG.SUPABASE_URL,TELECOD_CONFIG.SUPABASE_ANON_KEY);pasteForm.onsubmit=async e=>{e.preventDefault();msg.innerHTML="";let {data:{user}}=await s.auth.getUser();let slug=crypto.randomUUID().replaceAll("-","").slice(0,12);let row={title:title.value,slug,content:content.value,visibility:visibility.value,password:pass.value||null};if(user)row.owner_id=user.id;let {error}=await s.from("pastes").insert(row);if(error){msg.innerHTML='<div class="error">'+error.message+'</div>';return}msg.innerHTML='<div class="success">Paste dibuat: <a href="paste-view.html?slug='+slug+'">Buka PasteLink</a></div>';pasteForm.reset()};</script></body></html>
