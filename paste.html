<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create PasteLink</title><link rel="stylesheet" href="css/global.css"><link rel="stylesheet" href="css/navbar.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/supabase.js"></script><script src="js/auth.js"></script><script src="js/navbar.js"></script><script src="js/paste.js" defer></script></head><body><div id="navbar"></div><main class="section"><div class="container"><div class="card" style="padding:25px"><h1>Create PasteLink</h1><p class="muted">JustPaste-style publishing: text/code, syntax, tags, expiry, visibility, raw, download, comments, timeline, anonymous.</p><form id="pasteForm"><div class="grid grid-2"><div class="field"><label>Title</label><input class="input" name="title" placeholder="My Paste"></div><div class="field"><label>Custom slug (optional)</label><input class="input" name="slug" placeholder="my-paste"></div><div class="field"><label>Author</label><input class="input" name="author_name"></div><div class="field"><label>Syntax</label><select class="select" name="syntax"><option>text</option><option>javascript</option><option>html</option><option>css</option><option>json</option><option>python</option><option>php</option><option>sql</option><option>bash</option></select></div><div class="field"><label>Visibility</label><select class="select" name="visibility"><option value="public">Public</option><option value="unlisted">Unlisted</option><option value="private">Private</option></select></div><div class="field"><label>Expire at (optional)</label><input class="input" type="datetime-local" name="expires_at"></div><div class="field"><label>Tags</label><input class="input" name="tags" placeholder="code,api,telegram"></div><div class="field"><label>Destination URL</label><input class="input" name="destination_url" placeholder="https://..."></div></div><div class="field"><label>Description</label><textarea class="textarea" name="description"></textarea></div><div class="field"><label>Content</label><textarea class="textarea" name="content" style="min-height:330px" required placeholder="Paste your text or code here..."></textarea></div><div class="grid grid-3"><label><input type="checkbox" name="allow_comments" checked> Comments</label><label><input type="checkbox" name="allow_download" checked> Download</label><label><input type="checkbox" name="show_raw" checked> Raw</label><label><input type="checkbox" name="publish_timeline"> Timeline</label><label><input type="checkbox" name="anonymous"> Anonymous</label></div><button class="btn primary" style="margin-top:20px">Publish PasteLink</button></form></div></div></main><div id="toast" class="toast hidden"></div></body></html>
