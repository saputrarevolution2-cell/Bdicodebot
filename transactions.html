<!doctype html>
<html lang="id">
<head>
  <script src="js/theme-preload.js"></script>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/js/config.js?v=20260831"></script>
  <script src="/js/supabase.js?v=20260831"></script>
  <script src="/js/debug-panel.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/navbar.js?v=20260903-fix"></script>
  <title>Transactions — PasTele</title>
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
  >
  <link rel="stylesheet" href="css/app.css?v=20260904">
  <link rel="stylesheet" href="css/transactions.css?v=20260904">
</head>
<body class="app-page">
  <div id="navbar"></div>
  <main>
    <section class="section transactions-page">
      <div class="container">
        <!-- HEADER -->
        <div class="tx-header">
          <div class="tx-heading">
            <span class="badge">
              <i class="fa-solid fa-arrow-right-arrow-left"></i>
              TRANSACTIONS
            </span>
            <h1>Semua transaksi</h1>
            <p class="muted">
              Pantau seluruh aktivitas pembelian, penjualan, dan wallet kamu.
            </p>
          </div>
          <button
            type="button"
            class="btn tx-refresh"
            id="refreshBtn"
          >
            <i class="fa-solid fa-rotate-right"></i>
            <span>Refresh</span>
          </button>
        </div>
        <!-- SUMMARY -->
        <div class="tx-summary" id="summary">
          <div class="tx-summary-item">
            <span class="tx-summary-icon">
              <i class="fa-solid fa-cart-shopping"></i>
            </span>
            <div>
              <small>Total Buy</small>
              <strong>—</strong>
            </div>
          </div>
          <div class="tx-summary-item">
            <span class="tx-summary-icon">
              <i class="fa-solid fa-store"></i>
            </span>
            <div>
              <small>Total Sell</small>
              <strong>—</strong>
            </div>
          </div>
          <div class="tx-summary-item">
            <span class="tx-summary-icon">
              <i class="fa-solid fa-wallet"></i>
            </span>
            <div>
              <small>Wallet</small>
              <strong>—</strong>
            </div>
          </div>
          <div class="tx-summary-item">
            <span class="tx-summary-icon">
              <i class="fa-solid fa-receipt"></i>
            </span>
            <div>
              <small>Total Aktivitas</small>
              <strong>—</strong>
            </div>
          </div>
        </div>
        <!-- TOOLBAR -->
        <div class="tx-toolbar">
          <div class="tx-search">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input
              type="search"
              id="searchInput"
              autocomplete="off"
              placeholder="Cari transaksi, produk, referensi..."
            >
            <button
              type="button"
              id="clearSearch"
              class="tx-search-clear"
              aria-label="Hapus pencarian"
              hidden
            >
              <i class="fa-solid fa-xmark"></i>
            </button>
          </div>
          <div class="tx-filters">
            <button type="button" class="tx-filter active" data-filter="all">
              Semua
            </button>
            <button type="button" class="tx-filter" data-filter="buy">
              <i class="fa-solid fa-arrow-down"></i>
              Buy
            </button>
            <button type="button" class="tx-filter" data-filter="sell">
              <i class="fa-solid fa-arrow-up"></i>
              Sell
            </button>
            <button type="button" class="tx-filter" data-filter="wallet">
              <i class="fa-solid fa-wallet"></i>
              Wallet
            </button>
          </div>
        </div>
        <!-- RESULT INFO -->
        <div class="tx-resultbar">
          <div>
            <span id="resultLabel">Semua transaksi</span>
            <small id="resultCount">Memuat...</small>
          </div>
          <button
            type="button"
            class="tx-reset"
            id="resetFilters"
            hidden
          >
            <i class="fa-solid fa-filter-circle-xmark"></i>
            Reset
          </button>
        </div>
        <!-- CONTENT -->
        <div id="content" class="tx-list">
          <div class="tx-loading">
            <span class="tx-spinner">
              <i class="fa-solid fa-circle-notch"></i>
            </span>
            <div>
              <strong>Memuat transaksi</strong>
              <small>Tunggu sebentar...</small>
            </div>
          </div>
        </div>
      </div>
    </section>
  </main>
  <div id="toast"></div>
  <script src="js/transactions.js?v=20260904"></script>
  <script src="js/site-shell.js?v=20260904"></script>
</body>
</html>
