<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create Product</title><link rel="stylesheet" href="css/global.css"><link rel="stylesheet" href="css/navbar.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/supabase.js"></script><script src="js/auth.js"></script><script src="js/navbar.js"></script><script src="js/products.js" defer></script></head><body><div id="navbar"></div><main class="section"><div class="container"><form id="productForm" class="card" style="padding:25px"><h1>Create Product</h1><div class="grid grid-2"><input class="input" name="title" placeholder="Title" required><input class="input" name="slug" placeholder="unique-slug" required><input class="input" name="category" placeholder="Category"><input class="input" name="price" type="number" min="0" placeholder="Price IDR" required><input class="input" name="thumbnail_url" placeholder="Thumbnail URL"><input class="input" name="delivery_url" placeholder="Delivery URL"><select class="select" name="type"><option value="code">Code</option><option value="file">File</option><option value="service">Service</option></select><select class="select" name="access_type"><option value="free">Free</option><option value="paid">Paid</option></select><input class="input" name="telegram_channel" placeholder="Telegram channel (optional)"></div><textarea class="textarea" name="description" placeholder="Description" style="margin-top:15px"></textarea><textarea class="textarea" name="content" placeholder="Product content" style="margin-top:15px"></textarea><button class="btn primary" style="margin-top:15px">Create</button></form></div></main><div id="toast" class="toast hidden"></div></body></html>
