<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/config.js"></script><script src="js/supabase.js"></script><script src="js/auth.js"></script><script src="js/navbar.js"></script><link rel="stylesheet" href="css/global.css"><link rel="stylesheet" href="css/navbar.css"><title>Create Product</title><link rel="stylesheet" href="css/pastele-polish.css"></head><body><div id="navbar"></div><main><section class="section"><div class="container"><div class="card"><span class="badge">Marketplace</span><h1>Create Product</h1><form id="f" class="list"><input id="title" class="input" placeholder="Judul" required><input id="slug" class="input" placeholder="Slug" required><div class="field"><label>Harga (IDR)</label><input id="price" class="input" type="number" min="0" step="1000" placeholder="0"></div><input id="thumb" class="input" placeholder="Thumbnail URL"><select id="type" class="select"><option value="link">Link</option><option value="code">Code</option><option value="channel">Channel</option><option value="group">Group</option></select><div class="field"><label>Akses</label><select id="access" class="select"><option value="free">Free</option><option value="paid">Paid</option></select></div><textarea id="desc" class="textarea" placeholder="Deskripsi"></textarea><textarea id="content" class="textarea" placeholder="Content / delivery"></textarea><button class="btn primary">Simpan</button></form></div></div></section></main><footer class="footer"><div class="container grid grid-3"><div><a class="brand" href="index.html"><i class="fa-solid fa-bolt"></i> PasTele</a><p class="muted">Publish, share and sell digital content dengan pengalaman modern yang cepat, aman dan responsif.</p></div><div><b>Platform</b><p class="muted"><a href="marketplace.html">Marketplace</a><br><a href="paste.html">Create</a><br><a href="dashboard.html">Dashboard</a></p></div><div><b>Account</b><p class="muted"><a href="login.html">Login</a> · <a href="register.html">Register</a><br><a href="settings.html">Settings</a></p></div></div><div class="container muted" style="margin-top:25px;font-size:12px">© 2026 PasTele. Gunakan platform sesuai hukum dan kebijakan yang berlaku.</div></footer><div id="toast"></div><script>
document.getElementById('access')?.addEventListener('change',()=>{const p=document.getElementById('price');if(p){p.required=document.getElementById('access').value==='paid';if(!p.required)p.value='0'}});document.getElementById('access')?.dispatchEvent(new Event('change'));
</script><script>document.getElementById("f").onsubmit=async e=>{e.preventDefault();let u=await TC.user();if(!u)return location.href="login.html";let {error}=await sb.from("products").insert({seller_id:u.id,creator_id:u.id,title:title.value,slug:slug.value,price:Number(price.value),thumbnail_url:thumb.value||null,type:type.value,access_type:access.value,description:desc.value,content:content.value,status:"draft"});TC.toast(error?error.message:"Produk dibuat sebagai draft");if(!error)setTimeout(()=>location.href="my-products.html",700)}</script></body></html>
