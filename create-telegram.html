<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="color-scheme" content="light dark">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><title>Buat Channel / Group — PasTele</title>
  <!-- PasTele canonical UI stack -->
  


  
  <link rel="stylesheet" href="css/create-telegram.css?v=20260918-unified">
    
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="assets/favicon.svg">
<script>window.PASTELE_PUBLIC_PAGE=true;</script>
<script src="js/db-contract.js?v=20260918-db-contract"></script>
<script src="js/rpc-contract.js?v=20260918-rpc-contract"></script>
</head><body class="app-page create-detail-page"><div id="navbar"></div><main class="create-detail">
<section class="create-detail-head"><a class="back-create" href="create-product.html"><i class="fa-solid fa-arrow-left"></i><span>Semua tipe</span></a><div class="detail-title"><div class="detail-icon"><i id="pageIcon" class="fa-solid fa-tower-broadcast"></i></div><div><span class="eyebrow">TELEGRAM</span><h1>Buat Channel / Group</h1><p>Publikasikan akses Channel atau Group Telegram secara rapi.</p></div></div></section>
<form id="createForm" class="create-card" novalidate autocomplete="off">
<div class="type-switch"><a data-kind="channel" href="create-telegram.html?type=channel"><i class="fa-solid fa-tower-broadcast"></i>Channel</a><a data-kind="group" href="create-telegram.html?type=group"><i class="fa-solid fa-users"></i>Group</a></div>
<div class="field"><label for="title">Judul <em>*</em></label><input id="title" maxlength="120" required placeholder="Contoh: Komunitas Premium"><small>Judul yang ditampilkan di marketplace.</small></div>
<div class="field"><label>Jenis Akses</label><div class="access-grid"><label class="access-option"><input type="radio" name="access" value="free" checked><span><b><i class="fa-solid fa-unlock"></i> Gratis</b><small>Terbuka untuk semua</small></span></label><label class="access-option"><input type="radio" name="access" value="paid"><span><b><i class="fa-solid fa-lock"></i> Berbayar</b><small>Pembeli harus membayar</small></span></label></div></div>
<div id="priceBox" class="field price-box" hidden><label for="price">Nominal Harga <em>*</em></label><div class="money-input"><span>Rp</span><input id="price" type="number" min="2000" max="100000" step="1000" value="2000" inputmode="numeric"></div><small>Rp2.000–Rp100.000 dan kelipatan Rp1.000.</small></div>
<div class="field"><label for="description">Deskripsi <span>Opsional</span></label><textarea id="description" maxlength="3000" rows="4" placeholder="Jelaskan isi, manfaat, aturan, atau informasi komunitas..."></textarea><small><span id="counter">0</span>/3000</small></div>
<div class="field"><label for="telegram">Link Group / Channel <em>*</em></label><div class="telegram-url"><span><i class="fa-brands fa-telegram"></i></span><input id="telegram" required placeholder="https://t.me/username atau @username" autocomplete="off"></div><small>Masukkan link publik Telegram atau username yang valid.</small></div>
<div class="create-actions"><a href="my-products.html" class="btn secondary"><i class="fa-solid fa-xmark"></i>Batal</a><button id="submitBtn" class="btn primary" type="submit"><span class="normal"><i class="fa-solid fa-cloud-arrow-up"></i>Publikasikan <span id="kindLabel">Channel</span></span><span class="loading" hidden><i class="fa-solid fa-spinner fa-spin"></i>Menyimpan...</span></button></div>
</form><section id="result" class="create-result" hidden></section></main><div id="toast"></div><script src="js/create-telegram.js?v=20260918-public-no-session-lock"></script>
<script src="js/global-notifications.js?v=20260918-toast"></script>
<script src="js/pastele-data-contract.js"></script>
</body></html>
