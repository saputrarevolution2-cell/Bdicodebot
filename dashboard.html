<!doctype html>
<html lang="id">

<head>

<meta charset="utf-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1,viewport-fit=cover"
>

<title>TeleCod Dashboard</title>


<!-- =========================
     GOOGLE FONT
========================= -->

<link rel="preconnect" href="https://fonts.googleapis.com">

<link
  href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&display=swap"
  rel="stylesheet"
>


<!-- =========================
     FONT AWESOME
========================= -->

<link
  rel="stylesheet"
  href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
>


<!-- =========================
     DASHBOARD CSS
========================= -->

<link rel="stylesheet" href="/css/dashboard.css">


<!-- =========================
     SUPABASE
========================= -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<!-- =========================
     TELECOD CONFIG
========================= -->

<script src="/js/config.js"></script>

<script src="/js/config-compat.js"></script>


<!-- =========================
     TELECOD UI
========================= -->

<link rel="stylesheet" href="/js/telecod-ui.css">

<script src="/js/fee.js"></script>

<script src="/js/ui-state.js"></script>

<script src="/js/telecod-ui.js"></script>


</head>


<body>


<div class="app">


<!-- =========================
     TOPBAR
========================= -->

<header class="topbar">

  <button
    class="menu-btn"
    id="menuBtn"
    aria-label="Menu"
  >
    <i class="fa-solid fa-bars"></i>
  </button>


  <a
    class="brand"
    href="/dashboard.html"
  >
    TELE<span>COD</span>
  </a>


  <div class="top-actions">


    <button
      class="icon-btn"
      id="themeBtn"
      title="Theme"
    >
      <i class="fa-solid fa-circle-half-stroke"></i>
    </button>


    <button
      class="icon-btn"
      id="langBtn"
    >
      ID
    </button>


    <button
      class="icon-btn"
      id="notifBtn"
    >
      <i class="fa-regular fa-bell"></i>
    </button>


    <button
      class="avatar-btn"
      id="userBtn"
    >

      <span
        class="avatar"
        id="avatar"
      >
        U
      </span>

      <span
        class="top-user-name"
        id="topUser"
      >
        User
      </span>

      ▾

    </button>

  </div>

</header>



<!-- =========================
     MOBILE OVERLAY
========================= -->

<div
  class="overlay"
  id="overlay"
></div>



<!-- =========================
     MAIN LAYOUT
========================= -->

<div class="layout">


<!-- =========================
     SIDEBAR
========================= -->

<aside
  class="sidebar"
  id="sidebar"
>


  <!-- MAIN -->

  <div
    class="nav-section"
    data-i18n="main"
  >
    Main
  </div>


  <a
    class="nav-item"
    data-page="dashboard"
    href="/dashboard.html?page=dashboard"
  >

    <span class="ico">
      <i class="fa-solid fa-house"></i>
    </span>

    <span data-i18n="dashboard">
      Dashboard
    </span>

  </a>



  <a
    class="nav-item"
    data-page="marketplace"
    href="/dashboard.html?page=marketplace"
  >

    <span class="ico">
      <i class="fa-solid fa-cart-shopping"></i>
    </span>

    <span data-i18n="marketplace">
      Marketplace
    </span>

  </a>



  <!-- CREATOR -->

  <div
    class="nav-section"
    data-i18n="creator"
  >
    Creator
  </div>



  <!-- CHANNEL -->

  <button
    class="nav-parent"
    data-toggle="channel"
  >

    <span class="ico">
      <i class="fa-solid fa-bullhorn"></i>
    </span>

    <span data-i18n="channel">
      Channel
    </span>

    <span class="chev">
      ⌄
    </span>

  </button>



  <div
    class="submenu"
    id="submenu-channel"
  >

    <a
      class="create-link"
      href="/dashboard.html?page=create-channel"
    >

      ＋

      <span data-i18n="createChannel">
        Buat / Tambah Channel
      </span>

    </a>


    <a
      href="/dashboard.html?page=channel-free"
      data-page="channel-free"
    >
      Free
    </a>


    <a
      href="/dashboard.html?page=channel-paid"
      data-page="channel-paid"
    >
      Paid
    </a>

  </div>



  <!-- CODE -->

  <button
    class="nav-parent"
    data-toggle="code"
  >

    <span class="ico">
      <i class="fa-solid fa-code"></i>
    </span>

    <span data-i18n="code">
      Code
    </span>

    <span class="chev">
      ⌄
    </span>

  </button>



  <div
    class="submenu"
    id="submenu-code"
  >

    <a
      class="create-link"
      href="/dashboard.html?page=create-code"
    >

      ＋

      <span data-i18n="createCode">
        Buat / Tambah Code
      </span>

    </a>


    <a
      href="/dashboard.html?page=code-free"
      data-page="code-free"
    >
      Free
    </a>


    <a
      href="/dashboard.html?page=code-paid"
      data-page="code-paid"
    >
      Paid
    </a>

  </div>



  <!-- ACCOUNT -->

  <div
    class="nav-section"
    data-i18n="account"
  >
    Account
  </div>



  <a
    class="nav-item"
    data-page="purchases"
    href="/dashboard.html?page=purchases"
  >

    <span class="ico">
      <i class="fa-solid fa-receipt"></i>
    </span>

    <span data-i18n="purchases">
      My Purchases
    </span>

  </a>



  <a
    class="nav-item"
    data-page="payment"
    href="/dashboard.html?page=payment"
  >

    <span class="ico">
      <i class="fa-solid fa-credit-card"></i>
    </span>

    <span data-i18n="payment">
      Payment
    </span>

  </a>



  <a
    class="nav-item"
    data-page="profile"
    href="/dashboard.html?page=profile"
  >

    <span class="ico">
      <i class="fa-solid fa-user"></i>
    </span>

    <span data-i18n="profile">
      Profile
    </span>

  </a>



  <a
    class="nav-item"
    data-page="settings"
    href="/dashboard.html?page=settings"
  >

    <span class="ico">
      <i class="fa-solid fa-gear"></i>
    </span>

    <span data-i18n="settings">
      Pengaturan
    </span>

  </a>



  <!-- ADMIN -->

  <a
    class="nav-item"
    id="adminNav"
    href="/admin.html"
    style="display:none"
  >

    <span class="ico">
      <i class="fa-solid fa-shield-halved"></i>
    </span>

    <span>
      Admin Panel
    </span>

  </a>



  <div style="height:20px"></div>



  <!-- LOGOUT -->

  <a
    class="nav-item"
    id="logoutBtn"
    href="#"
  >

    <span class="ico">
      <i class="fa-solid fa-right-from-bracket"></i>
    </span>

    <span data-i18n="logout">
      Log Out
    </span>

  </a>


</aside>



<!-- =========================
     MAIN CONTENT
========================= -->

<main class="main">

  <div
    class="container"
    id="content"
  ></div>

</main>


</div>



<!-- =========================
     TOAST
========================= -->

<div
  class="toast"
  id="toast"
></div>



<!-- =========================
     MODAL
========================= -->

<div
  class="modal-backdrop"
  id="modal"
>

  <div
    class="modal"
    id="modalBody"
  ></div>

</div>


</div>



<!-- =========================
     DASHBOARD JS
========================= -->

<script src="/js/dashboard.js"></script>



<!-- =========================
     MARKETPLACE FEE
========================= -->

<section
  class="telecod-fee-summary"
  aria-label="Marketplace fee"
>

  <div>

    <strong>
      Marketplace Fee
    </strong>

    <span>
      20%
    </span>

  </div>


  <small>
    Harga penjualan Rp10.000 → fee Rp2.000 → masuk saldo Rp8.000.
  </small>

</section>



</body>

</html>
