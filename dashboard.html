<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dashboard — TeleCod</title><link rel="stylesheet" href="assets/app.css"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"></head><body><header class="topbar"><div class="wrap nav"><a class="brand" href="index.html"><span class="brandmark"><i class="fa-brands fa-telegram"></i></span><span>Tele<span>Cod</span></span></a><button class="btn ghost" id="logout">Logout</button></div></header><main class="section"><div class="wrap"><div class="section-head"><div><span class="kicker">DASHBOARD</span><h2 id="hello">Account</h2></div><a class="btn primary" href="seller.html">Create Product</a></div><div class="cards" style="display:grid;grid-template-columns:repeat(3,1fr);gap:15px"><div class="card"><h3>My Products</h3><b id="products">0</b></div><div class="card"><h3>Orders</h3><b id="orders">0</b></div><div class="card"><h3>Profile</h3><b id="email">—</b></div></div></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="assets/config.js"></script><script>const s=supabase.createClient(TELECOD_CONFIG.SUPABASE_URL,TELECOD_CONFIG.SUPABASE_ANON_KEY);async function go(){let {data:{user}}=await s.auth.getUser();if(!user){location.href="login.html";return}hello.textContent="Hello, "+(user.user_metadata?.display_name||user.email);email.textContent=user.email;let p=await s.from("products").select("id",{count:"exact",head:true}).eq("seller_id",user.id);let o=await s.from("orders").select("id",{count:"exact",head:true}).eq("buyer_id",user.id);products.textContent=p.count||0;orders.textContent=o.count||0}logout.onclick=async()=>{await s.auth.signOut();location.href="index.html"};go()</script></body></html>
