<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login — TeleCod</title><link rel="stylesheet" href="assets/app.css"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"></head><body><main class="auth-page"><div class="auth-card"><a class="brand" href="index.html"><span class="brandmark"><i class="fa-brands fa-telegram"></i></span><span>Tele<span>Cod</span></span></a><h1>Welcome back.</h1><p>Login untuk mengelola produk dan pembelian.</p><div id="msg"></div><form class="form" id="form"><label>Email</label><input id="email" type="email" required autocomplete="email"><label>Password</label><input id="password" type="password" required autocomplete="current-password"><button class="btn primary" type="submit">Login <i class="fa-solid fa-arrow-right"></i></button></form><p style="text-align:center">Belum punya akun? <a style="color:#62ddff;font-weight:800" href="register.html">Register</a></p></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="assets/config.js"></script><script>const s=supabase.createClient(TELECOD_CONFIG.SUPABASE_URL,TELECOD_CONFIG.SUPABASE_ANON_KEY);form.onsubmit=async e=>{e.preventDefault();msg.innerHTML="";const {error}=await s.auth.signInWithPassword({email:email.value,password:password.value});if(error){msg.innerHTML='<div class="error">'+error.message+'</div>';return}location.href="dashboard.html"};</script></body></html>
