<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login — TeleCod</title><link rel="stylesheet" href="css/global.css"><link rel="stylesheet" href="css/auth.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/supabase.js"></script><script src="js/auth.js"></script></head><body><main class="auth"><form id="form" class="card auth-box"><div class="auth-logo"><div class="brand">Tele<span class="glow">Cod</span></div><p class="muted">Masuk ke akun Anda</p></div><div class="field"><label>Email</label><input class="input" id="email" type="email" required></div><div class="field"><label>Kata sandi</label><div class="password-wrap"><input class="input" id="password" type="password" required><button type="button" class="toggle-pass">👁</button></div></div><div class="auth-actions"><button class="btn primary">Masuk</button><button type="button" class="btn" id="google">Google</button></div><p class="muted" style="text-align:center">Belum punya akun? <a class="glow" href="register.html">Daftar</a></p></form></main><div id="toast" class="toast hidden"></div><script>$('#form').onsubmit=e=>{e.preventDefault();doLogin($('#email').value,$('#password').value).catch(e=>toast(e.message))};$('#google').onclick=async()=>{const {error}=await sb.auth.signInWithOAuth({provider:'google',options:{redirectTo:location.origin+'/dashboard.html'}});if(error)toast(error.message)}</script></body></html>
