<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Theme -->
  <script src="js/theme-preload.js"></script>
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <title>Login — PasTele</title>
  <!-- Core configuration -->
  <script src="/js/config.js?v=20260831"></script>
  <script src="/js/supabase.js?v=20260831"></script>
  <!-- Authentication -->
  <script src="/js/debug-panel.js"></script>
  <script src="/js/auth.js"></script>
  <!-- Font Awesome -->
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
  >
  <!-- Styles -->
  <link
    rel="stylesheet"
    href="css/app.css?v=20260904"
  >
  <link
    rel="stylesheet"
    href="css/login.css?v=20260904"
  >
</head>
<body>
  <main class="auth-shell">
    <div class="card auth-card">
      <!-- Logo -->
      <div class="auth-logo" aria-hidden="true">
        <i class="fa-solid fa-bolt"></i>
      </div>
      <!-- Title -->
      <h1>Masuk ke PasTele</h1>
      <p class="muted">
        Gunakan username atau Gmail.
      </p>
      <!-- =====================================================
           STEP 1 — USERNAME / GMAIL
           ===================================================== -->
      <form
        class="list"
        id="loginStep1"
        autocomplete="on"
      >
        <div class="field">
          <label for="identifier">
            Username / Gmail
          </label>
          <input
            id="identifier"
            name="identifier"
            class="input"
            type="text"
            autocomplete="username"
            autocapitalize="none"
            spellcheck="false"
            required
          >
        </div>
        <button
          type="submit"
          class="btn primary"
        >
          <i class="fa-solid fa-arrow-right"></i>
          Lanjut
        </button>
      </form>
      <!-- =====================================================
           STEP 2 — PASSWORD
           ===================================================== -->
      <form
        class="list hidden"
        id="loginStep2"
        autocomplete="on"
      >
        <div class="field">
          <label for="password">
            Kata sandi
          </label>
          <div class="row">
            <input
              id="password"
              name="password"
              class="input"
              type="password"
              autocomplete="current-password"
              required
            >
            <button
              type="button"
              class="btn"
              id="toggle"
              aria-label="Tampilkan kata sandi"
              title="Tampilkan kata sandi"
            >
              <i class="fa-solid fa-eye"></i>
            </button>
          </div>
        </div>
        <button
          type="submit"
          class="btn primary"
        >
          <i class="fa-solid fa-right-to-bracket"></i>
          Masuk
        </button>
        <a
          class="muted"
          href="#"
          id="forgot"
        >
          Lupa kata sandi?
        </a>
      </form>
      <!-- =====================================================
           DIVIDER
           ===================================================== -->
      <div class="auth-divider">
        <span>atau</span>
      </div>
      <!-- =====================================================
           GOOGLE LOGIN
           ===================================================== -->
      <button
        type="button"
        class="btn"
        id="google"
      >
        <i class="fa-brands fa-google"></i>
        Login dengan Gmail
      </button>
      <!-- =====================================================
           REGISTER / BACK
           ===================================================== -->
      <p class="muted">
        Belum punya akun?
        <a href="register.html">
          Register
        </a>
        ·
        <a href="index.html">
          Kembali
        </a>
      </p>
    </div>
  </main>
  <!-- =========================================================
       GLOBAL FLOATING TOAST
       SATU-SATUNYA CONTAINER NOTIFIKASI
       ========================================================= -->
  <div
    id="toast"
    role="alert"
    aria-live="polite"
    aria-atomic="true"
  ></div>
  <!-- Scripts -->
  <script src="js/login.js?v=20260904"></script>
  <script src="js/site-shell.js?v=20260904"></script>
</body>
</html>
