<!DOCTYPE html>
<html lang="id">
<head><script>(()=>{try{const k='pastele-theme',m=localStorage.getItem(k)||'system',d=m==='dark'||(m==='system'&&matchMedia('(prefers-color-scheme: dark)').matches);document.documentElement.dataset.theme=d?'dark':'light';document.documentElement.dataset.themeMode=m;document.documentElement.classList.add(d?'theme-dark':'theme-light');document.documentElement.style.colorScheme=d?'dark':'light'}catch(e){}})();</script>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <!-- =========================================================
       THEME PRELOAD
  ========================================================== -->
  <!-- =========================================================
       FONTS
  ========================================================== -->
  <link rel="preconnect" href="https://fonts.googleapis.com">


  <!-- =========================================================
       SUPABASE
  ========================================================== -->
  <script
    src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
  ></script>


  <title>Login — PasTele</title>


  <!-- =========================================================
       CORE CONFIGURATION
  ========================================================== -->
  <!-- =========================================================
       AUTHENTICATION
  ========================================================== -->
  
  <!-- =========================================================
       CLOUDFLARE TURNSTILE
       
       IMPORTANT:
       - Explicit rendering digunakan.
       - login.js yang melakukan render.
       - Site Key boleh berada di frontend.
       - Secret Key JANGAN pernah dimasukkan ke sini.
  ========================================================== -->
  <script
    src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit"
    async
    defer
  ></script>


  <!-- =========================================================
       FONT AWESOME
  ========================================================== -->
  <!-- =========================================================
       STYLES
  ========================================================== -->
  <!-- =========================================================
       LOGIN SECURITY PRESENTATION
       
       Ditaruh di head agar tidak terjadi flash style
       ketika Step 2 dan Turnstile ditampilkan.
  ========================================================== -->
  <style>

    /* =======================================================
       TURNSTILE WRAPPER
    ======================================================= */

    .turnstile-wrap {
      width: 100%;
      min-height: 65px;

      display: flex;
      align-items: center;
      justify-content: center;

      margin: 2px 0 6px;

      overflow: hidden;
    }


    /*
     * Explicit Turnstile membuat iframe di dalam container.
     * Jangan mengubah ukuran iframe secara manual.
     */

    .turnstile-wrap > iframe {
      max-width: 100%;
    }


    /* =======================================================
       SECURITY STATUS
    ======================================================= */

    .login-security-status {
      display: flex;
      align-items: center;
      gap: 8px;

      width: 100%;

      margin: 0 0 10px;

      padding: 9px 11px;

      border: 1px solid rgba(0, 184, 255, .12);

      border-radius: 10px;

      background: rgba(0, 184, 255, .05);

      color: #718096;

      font-size: 10px;

      line-height: 1.35;

      transition:
        background .2s ease,
        border-color .2s ease,
        color .2s ease;
    }


    .login-security-status i {
      flex: 0 0 auto;

      color: #00b8ff;

      font-size: 12px;
    }


    /* =======================================================
       VERIFIED
    ======================================================= */

    .login-security-status.verified {
      background: rgba(34, 197, 94, .07);

      border-color: rgba(34, 197, 94, .18);

      color: #16a34a;
    }


    .login-security-status.verified i {
      color: #22c55e;
    }


    /* =======================================================
       LOGIN BUTTON DISABLED
    ======================================================= */

    #loginSubmit:disabled {
      opacity: .55;

      cursor: not-allowed;

      filter: saturate(.65);

      transform: none;
    }


    #loginSubmit:not(:disabled) {
      cursor: pointer;
    }


    /* =======================================================
       FIELD HELP
    ======================================================= */

    .field-help {
      display: block;

      margin-top: 6px;

      color: #8a94a6;

      font-size: 9px;

      line-height: 1.4;
    }


    /* =======================================================
       DARK MODE
    ======================================================= */

    html[data-theme="dark"] .login-security-status {
      background: rgba(0, 234, 255, .055);

      border-color: rgba(0, 234, 255, .12);

      color: #8994a8;
    }


    html[data-theme="dark"] .login-security-status i {
      color: #00eaff;
    }


    html[data-theme="dark"]
    .login-security-status.verified {
      background: rgba(34, 197, 94, .08);

      border-color: rgba(34, 197, 94, .18);

      color: #4ade80;
    }


    html[data-theme="dark"]
    .login-security-status.verified i {
      color: #4ade80;
    }


    html[data-theme="dark"] .field-help {
      color: #8994a8;
    }


    /* =======================================================
       MOBILE
    ======================================================= */

    @media (max-width: 480px) {

      .turnstile-wrap {
        margin-top: 0;

        margin-bottom: 5px;

        min-height: 65px;

        overflow: visible;
      }

    }

  </style>

<script>document.documentElement.classList.add("pastele-ready");</script><link rel="stylesheet" href="css/login.css?v=20260910-clean-ui"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer"><link rel="stylesheet" href="css/core.css?v=20260910-core-fix">
<link rel="stylesheet" href="css/navbar.css?v=20260911-navbar-clean"><link rel="stylesheet" href="css/final-polish.css?v=20260911-final">
</head>


<body>

  <div id="navbar"></div>


  <!-- =========================================================
       LOGIN
  ========================================================== -->

  <main class="auth-shell">

    <section
      class="card auth-card"
      aria-labelledby="loginTitle"
    >


      <!-- =====================================================
           LOGO
      ====================================================== -->

      <div
        class="auth-logo"
        aria-hidden="true"
      >
        <i class="fa-solid fa-bolt"></i>
      </div>


      <!-- =====================================================
           TITLE
      ====================================================== -->

      <h1 id="loginTitle">
        Masuk ke PasTele
      </h1>

      <p class="muted">
        Gunakan username atau Gmail.
      </p>


      <!-- =====================================================
           STEP 1
           USERNAME / GMAIL
      ====================================================== -->

      <form
        class="list"
        id="loginStep1"
        autocomplete="on"
        novalidate
      >

        <div class="field">

          <label for="identifier">
            Username / Gmail
          </label>


          <div
            class="identifier-wrap"
            id="identifierWrap"
          >

            <input
              id="identifier"
              name="identifier"
              class="input"
              type="text"
              inputmode="email"
              autocomplete="username"
              autocapitalize="none"
              spellcheck="false"
              placeholder="Masukkan username atau Gmail"
              required
              aria-describedby="loginIdentifierHelp"
            >


            <span
              class="identifier-status"
              id="identifierStatus"
              aria-hidden="true"
            >

              <i
                class="fa-solid fa-check"
                aria-hidden="true"
              ></i>

            </span>

          </div>


          <!-- =================================================
               ACCOUNT FOUND STATE
          ================================================== -->

          <div
            class="login-verified-state hidden"
            id="loginVerifiedState"
            aria-live="polite"
          >

            <i
              class="fa-solid fa-circle-check"
              aria-hidden="true"
            ></i>

            <span>
              Masuk dengan username yang terdaftar
            </span>

          </div>


          <!-- =================================================
               HELP
          ================================================== -->

          <small
            id="loginIdentifierHelp"
            class="field-help"
          >
            Masukkan username atau alamat Gmail akun kamu.
          </small>

        </div>


        <!-- ===================================================
             CONTINUE
        ==================================================== -->

        <button
          type="submit"
          class="btn primary"
          id="continueLogin"
        >

          <i
            class="fa-solid fa-arrow-right"
            aria-hidden="true"
          ></i>

          <span>
            Lanjut
          </span>

        </button>

      </form>


      <!-- =====================================================
           STEP 2
           PASSWORD + TURNSTILE
           
           Awalnya hidden.
           login.js akan membuka Step 2 setelah Auth.lookup()
           menemukan akun.
      ====================================================== -->

      <form
        class="list hidden"
        id="loginStep2"
        autocomplete="on"
        novalidate
      >


        <!-- ===================================================
             PASSWORD HEADER
        ==================================================== -->

        <div class="password-heading">

          <span
            class="password-heading-icon"
            aria-hidden="true"
          >

            <i
              class="fa-solid fa-lock"
              aria-hidden="true"
            ></i>

          </span>


          <div>

            <strong>
              Masukkan kata sandi
            </strong>

            <span>
              Gunakan kata sandi akun kamu untuk masuk.
            </span>

          </div>

        </div>


        <!-- ===================================================
             PASSWORD
        ==================================================== -->

        <div class="field">

          <label for="password">
            Kata sandi
          </label>


          <div class="password-wrap">

            <input
              id="password"
              name="password"
              class="input"
              type="password"
              autocomplete="current-password"
              placeholder="Masukkan kata sandi"
              required
            >


            <button
              type="button"
              class="password-toggle"
              id="toggle"
              aria-label="Tampilkan kata sandi"
              title="Tampilkan kata sandi"
            >

              <i
                class="fa-solid fa-eye"
                aria-hidden="true"
              ></i>

            </button>

          </div>

        </div>


        <!-- ===================================================
             CLOUDFLARE TURNSTILE
             
             IMPORTANT:
             Container HARUS kosong.

             login.js akan melakukan:
             
             turnstile.render(
               container,
               {
                 sitekey: ...
               }
             );

             Jangan menambahkan .cf-turnstile di sini.
        ==================================================== -->

        <div
          class="turnstile-wrap"
          id="loginTurnstile"
          data-sitekey="0x4AAAAAAErjLed781i5lbu8"
          data-theme="auto"
          data-language="id"
          data-action="login"
          aria-label="Verifikasi keamanan"
        ></div>


        <!-- ===================================================
             SECURITY STATUS
        ==================================================== -->

        <div
          class="login-security-status"
          id="loginSecurityStatus"
          aria-live="polite"
          aria-atomic="true"
        >

          <i
            class="fa-solid fa-shield-halved"
            aria-hidden="true"
          ></i>

          <span>
            Selesaikan verifikasi keamanan sebelum masuk.
          </span>

        </div>


        <!-- ===================================================
             LOGIN
             
             Disabled sampai Turnstile berhasil.
        ==================================================== -->

        <button
          type="submit"
          class="btn primary"
          id="loginSubmit"
          disabled
          aria-disabled="true"
        >

          <i
            class="fa-solid fa-right-to-bracket"
            aria-hidden="true"
          ></i>

          <span>
            Masuk
          </span>

        </button>


        <!-- ===================================================
             FORGOT PASSWORD
        ==================================================== -->

        <a
          class="forgot-link"
          href="#"
          id="forgot"
        >

          <i
            class="fa-solid fa-key"
            aria-hidden="true"
          ></i>

          <span>
            Lupa kata sandi?
          </span>

        </a>


        <!-- ===================================================
             CHANGE ACCOUNT
        ==================================================== -->

        <button
          type="button"
          class="account-change-login"
          id="changeAccount"
        >

          <i
            class="fa-solid fa-arrow-left"
            aria-hidden="true"
          ></i>

          <span>
            Ganti akun
          </span>

        </button>

      </form>


      <!-- =====================================================
           DIVIDER
      ====================================================== -->

      <div
        class="auth-divider auth-or"
        aria-hidden="true"
      >

        <span>
          atau
        </span>

      </div>


      <!-- =====================================================
           GOOGLE LOGIN
      ====================================================== -->

      <button
        type="button"
        class="btn google-login-btn"
        id="google"
      >

        <span
          class="google-icon"
          aria-hidden="true"
        >

          <i
            class="fa-brands fa-google"
            aria-hidden="true"
          ></i>

        </span>

        <span>
          Login dengan Gmail
        </span>

      </button>


      <!-- =====================================================
           FOOTER
      ====================================================== -->

      <div class="auth-footer">


        <!-- REGISTER -->

        <div class="register-prompt">

          <span>
            Belum punya akun?
          </span>


          <a
            class="register-link"
            href="register.html"
          >

            <span>
              Register
            </span>

            <i
              class="fa-solid fa-arrow-right"
              aria-hidden="true"
            ></i>

          </a>

        </div>


        <!-- BACK -->

        <a
          class="back-link"
          href="index.html"
        >

          <i
            class="fa-solid fa-arrow-left"
            aria-hidden="true"
          ></i>

          <span>
            Kembali
          </span>

        </a>

      </div>

    </section>

  </main>


  <!-- =========================================================
       GLOBAL TOAST
  ========================================================== -->

  <div
    id="toast"
    role="alert"
    aria-live="polite"
    aria-atomic="true"
  ></div>


  <!-- =========================================================
       LOGIN SCRIPT
  ========================================================== -->

  <!-- =========================================================
       SITE SHELL
  ========================================================== -->

  <script src="js/navbar.js?v=20260911-final"></script><script src="js/login.js?v=20260910-clean-ui"></script></body>
</html>
