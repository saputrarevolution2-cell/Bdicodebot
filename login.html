<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Masuk — TeleCod</title>

    <meta
        name="description"
        content="Masuk ke akun TeleCod untuk membeli dan menjual Telegram Bot Code."
    >

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Poppins:wght@500;600;700;800;900&display=swap"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    >

    <link rel="stylesheet" href="assets/css/auth.css">
</head>

<body>

<div class="background-grid"></div>
<div class="stars"></div>

<div class="bg-glow glow-blue"></div>
<div class="bg-glow glow-purple"></div>
<div class="bg-glow glow-pink"></div>


<!-- BACK -->

<a href="index.html" class="back-home">
    <i class="fa-solid fa-arrow-left"></i>
    <span>Kembali ke TeleCod</span>
</a>


<!-- AUTH -->

<main class="auth-wrapper">

    <div class="auth-container">


        <!-- BRAND -->

        <div class="auth-brand">

            <div class="auth-logo">
                <i class="fa-brands fa-telegram"></i>
            </div>

            <div>
                <strong>Tele<span>Cod</span></strong>
                <small>Telegram Bot Code Marketplace</small>
            </div>

        </div>


        <!-- CARD -->

        <div class="auth-card">

            <div class="auth-header">

                <div class="auth-icon">
                    <i class="fa-solid fa-right-to-bracket"></i>
                </div>

                <h1>Selamat Datang</h1>

                <p>
                    Masuk ke akun TeleCod kamu
                    dan mulai menjelajahi marketplace.
                </p>

            </div>


            <!-- GOOGLE -->

            <button class="social-login">

                <i class="fa-brands fa-google"></i>

                <span>
                    Lanjutkan dengan Google
                </span>

            </button>


            <div class="divider">
                <span>atau</span>
            </div>


            <!-- FORM -->

            <form id="loginForm">

                <div class="form-group">

                    <label>
                        <i class="fa-solid fa-envelope"></i>
                        Email
                    </label>

                    <div class="input-wrapper">

                        <input
                            type="email"
                            id="email"
                            placeholder="Masukkan email kamu"
                            autocomplete="email"
                            required
                        >

                    </div>

                </div>


                <div class="form-group">

                    <div class="label-row">

                        <label>
                            <i class="fa-solid fa-lock"></i>
                            Password
                        </label>

                        <a href="#">
                            Lupa password?
                        </a>

                    </div>


                    <div class="input-wrapper">

                        <input
                            type="password"
                            id="password"
                            placeholder="Masukkan password"
                            autocomplete="current-password"
                            required
                        >

                        <button
                            type="button"
                            class="password-toggle"
                            id="passwordToggle"
                        >
                            <i class="fa-solid fa-eye"></i>
                        </button>

                    </div>

                </div>


                <label class="remember">

                    <input
                        type="checkbox"
                        id="remember"
                    >

                    <span></span>

                    Ingat saya

                </label>


                <button
                    type="submit"
                    class="auth-submit"
                >

                    <span>Masuk ke Akun</span>

                    <i class="fa-solid fa-arrow-right"></i>

                </button>

            </form>


            <div class="auth-register">

                Belum punya akun?

                <a href="register.html">
                    Daftar sekarang
                </a>

            </div>

        </div>


        <!-- SECURITY -->

        <div class="auth-security">

            <div>
                <i class="fa-solid fa-shield-halved"></i>
                Secure Login
            </div>

            <div>
                <i class="fa-solid fa-lock"></i>
                SSL Protected
            </div>

            <div>
                <i class="fa-brands fa-telegram"></i>
                Telegram Ready
            </div>

        </div>


        <p class="copyright">
            © 2026 TeleCod. All Rights Reserved.
        </p>

    </div>

</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/js/database.js"></script>
<script src="assets/js/auth.js"></script>

</body>
</html>
