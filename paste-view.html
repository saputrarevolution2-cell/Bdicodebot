<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/config.js"></script><script src="js/supabase.js"></script><script src="js/auth.js"></script><script src="js/navbar.js"></script><link rel="stylesheet" href="css/global.css"><link rel="stylesheet" href="css/navbar.css"><link rel="stylesheet" href="css/product.css"><title>Paste View</title><link rel="stylesheet" href="css/pastele-polish.css"></head><body><div id="navbar"></div><main><section class="section"><div class="container"><div class="card" id="pasteContent"><div class="empty">Memuat...</div></div></div></section></main><footer class="footer"><div class="container grid grid-3"><div><a class="brand" href="index.html"><i class="fa-solid fa-bolt"></i> PasTele</a><p class="muted">Publish, share and sell digital content dengan pengalaman modern yang cepat, aman dan responsif.</p></div><div><b>Platform</b><p class="muted"><a href="marketplace.html">Marketplace</a><br><a href="paste.html">Create</a><br><a href="dashboard.html">Dashboard</a></p></div><div><b>Account</b><p class="muted"><a href="login.html">Login</a> · <a href="register.html">Register</a><br><a href="settings.html">Settings</a></p></div></div><div class="container muted" style="margin-top:25px;font-size:12px">© 2026 PasTele. Gunakan platform sesuai hukum dan kebijakan yang berlaku.</div></footer><div id="toast"></div><script>document.addEventListener("DOMContentLoaded",async()=>{let slug=new URLSearchParams(location.search).get("slug");let {data,error}=await sb.from("pastelinks").select("*").eq("slug",slug).maybeSingle();if(error||!data)return pasteContent.innerHTML="<div class=empty>Paste tidak ditemukan.</div>";if(data.expires_at&&new Date(data.expires_at)<new Date())return pasteContent.innerHTML="<div class=empty>Paste sudah expired.</div>";pasteContent.innerHTML=`<span class="badge">${TC.esc(data.visibility)}</span><h1>${TC.esc(data.title)}</h1><div class="rich-output">${data.content_html}</div><p class="muted">${(data.tags||[]).map(x=>"#"+TC.esc(x)).join(" ")}</p>`;await sb.rpc("increment_paste_view",{p_slug:slug})})</script></body></html>
