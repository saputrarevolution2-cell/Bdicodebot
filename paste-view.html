<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Paste — TeleCod</title><link rel="stylesheet" href="assets/app.css"></head><body><main class="section"><div class="wrap" style="max-width:850px"><div id="box" class="auth-card" style="width:100%">Loading...</div></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="assets/config.js"></script><script src="assets/app.js"></script><script>const s=supabase.createClient(TELECOD_CONFIG.SUPABASE_URL,TELECOD_CONFIG.SUPABASE_ANON_KEY),slug=new URLSearchParams(location.search).get("slug");async function go(){let {data,error}=await s.from("pastes").select("title,content,visibility,password").eq("slug",slug).single();if(error){box.innerHTML='<div class="error">Paste tidak ditemukan.</div>';return}if(data.visibility==="private"){let {data:{user}}=await s.auth.getUser();if(!user){box.innerHTML='<div class="error">Paste ini private.</div>';return}}box.innerHTML=`<span class="kicker">PASTELINK</span><h1>${escapeHtml(data.title)}</h1><pre style="white-space:pre-wrap;background:#07111e;border:1px solid #1b2a3c;border-radius:14px;padding:20px;overflow:auto">${escapeHtml(data.content)}</pre>`}go()</script></body></html>
