<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PasTele — Signing in</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/config.js"></script><script src="js/supabase.js"></script><link rel="stylesheet" href="css/pastele-polish.css"></head><body style="font:16px system-ui;text-align:center;padding:20vh 20px"><h2><i class="fa-solid fa-spinner fa-spin"></i> Menyelesaikan login…</h2><p id="m">Mohon tunggu.</p><script>addEventListener('DOMContentLoaded',async()=>{if(!sb)return location.href='setup.html';const {data}=await sb.auth.getSession();if(data.session)location.replace('dashboard.html');else document.getElementById('m').textContent='Login tidak berhasil. Silakan kembali ke halaman login.'})</script></body></html>
