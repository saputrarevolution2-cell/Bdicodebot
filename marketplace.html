<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Marketplace — TeleCod</title><link rel="stylesheet" href="assets/app.css"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"></head><body><header class="topbar"><div class="wrap nav"><a class="brand" href="index.html"><span class="brandmark"><i class="fa-brands fa-telegram"></i></span><span>Tele<span>Cod</span></span></a><div class="nav-actions"><a class="btn ghost" href="login.html">Login</a><a class="btn primary" href="register.html">Register</a></div></div></header><main class="section"><div class="wrap"><div class="section-head"><div><span class="kicker">MARKETPLACE</span><h2>Code, bot, media & digital access.</h2></div></div><div id="grid" class="product-grid"><div class="loading">Loading...</div></div></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="assets/config.js"></script><script src="assets/app.js"></script><script>async function load(){let {data,error}=await sb.from("products").select("id,title,slug,price,thumbnail_url,category").eq("status","published").order("created_at",{ascending:false});if(error){grid.innerHTML='<div class="error">'+error.message+'</div>';return}grid.innerHTML=data.length?data.map(x=>`<a class="product" href="product.html?slug=${encodeURIComponent(x.slug)}"><div class="thumb">${x.thumbnail_url?`<img src="${escapeHtml(x.thumbnail_url)}">`:'<i class="fa-solid fa-code"></i>'}</div><div class="pbody"><small>${escapeHtml(x.category||"Digital")}</small><h3>${escapeHtml(x.title)}</h3><b>${money(x.price)}</b></div></a>`).join(""):'<div class="empty">Belum ada produk.</div>'}load()</script></body></html>
