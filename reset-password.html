<!doctype html><html lang="id"><head>
  <script src="js/theme-preload.js?v=20260912"></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PasTele · Reset Password</title><link rel="stylesheet" href="css/core.css"><link rel="stylesheet" href="css/login.css"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"><link rel="stylesheet" href="css/public-session.css?v=20260911">  <link rel="stylesheet" href="css/final-polish.css?v=20260912">
  <link rel="stylesheet" href="css/pastele-theme.css?v=20260912">
  <script src="js/theme.js?v=20260912"></script>
</head><body><main style="min-height:100vh;display:grid;place-items:center;padding:20px"><section class="card" style="width:min(520px,100%);padding:28px"><h1><i class="fa-solid fa-lock"></i> Password baru</h1><p>Buat password baru untuk akun kamu.</p><form id="reset"><input id="p1" type="password" minlength="8" required autocomplete="new-password" placeholder="Password baru"><input id="p2" type="password" minlength="8" required autocomplete="new-password" placeholder="Ulangi password" style="margin-top:10px"><button class="btn primary" style="width:100%;margin-top:12px">Simpan password</button></form><p id="msg"></p></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/config.js"></script><script src="js/supabase.js"></script><script>reset.onsubmit=async e=>{e.preventDefault();if(p1.value!==p2.value){msg.textContent="Password tidak sama.";return}try{const{error}=await sb.auth.updateUser({password:p1.value});if(error)throw error;msg.textContent="Password berhasil diubah. Silakan login kembali.";msg.style.color="#10b981";setTimeout(()=>location.replace("login.html"),1200)}catch(e){msg.textContent=e.message;msg.style.color="#ef4444"}};</script></body></html>
