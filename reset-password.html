<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PasTele — Reset password</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/config.js"></script><script src="js/supabase.js"></script><style>body{font:15px system-ui;background:#f7f9fb;color:#17212b}.box{max-width:430px;margin:10vh auto;background:#fff;padding:28px;border:1px solid #e6ebef;border-radius:22px}.input{width:100%;box-sizing:border-box;padding:12px;border:1px solid #dce4ea;border-radius:11px;margin:8px 0 14px}.btn{padding:12px 17px;border:0;border-radius:11px;background:#3390ec;color:#fff;font-weight:750}</style><link rel="stylesheet" href="css/pastele-polish.css"></head><body><div class="box"><h1>Reset kata sandi</h1><p>Masukkan kata sandi baru.</p><form id=f><input id=p class=input type=password minlength=6 required placeholder="Kata sandi baru"><button class=btn>Simpan</button></form><p id=m></p></div><script>f.onsubmit=async e=>{e.preventDefault();if(!sb)return m.textContent='Supabase belum dikonfigurasi.';const {error}=await sb.auth.updateUser({password:p.value});m.textContent=error?error.message:'Password berhasil diubah. Silakan login.';if(!error)setTimeout(()=>location.href='login.html',1200)}</script></body></html>
