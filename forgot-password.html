<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PasTele · Lupa Password</title><link rel="stylesheet" href="css/core.css"><link rel="stylesheet" href="css/login.css"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"></head><body><main style="min-height:100vh;display:grid;place-items:center;padding:20px"><section class="card" style="width:min(520px,100%);padding:28px"><h1><i class="fa-solid fa-key"></i> Lupa kata sandi</h1><p>Masukkan email akun. Supabase Auth akan mengirim tautan reset.</p><form id="forgot"><input id="email" type="email" required autocomplete="email" placeholder="nama@email.com"><button class="btn primary" style="width:100%;margin-top:12px">Kirim tautan reset</button></form><p id="msg"></p><a class="btn" style="width:100%" href="login.html">Kembali ke login</a></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/config.js"></script><script src="js/supabase.js"></script><script>forgot.onsubmit=async e=>{e.preventDefault();try{const{error}=await sb.auth.resetPasswordForEmail(email.value.trim(),{redirectTo:new URL("reset-password.html",location.href).href});if(error)throw error;msg.textContent="Jika email terdaftar, tautan reset sudah dikirim. Cek Inbox/Spam.";msg.style.color="#10b981"}catch(e){msg.textContent=e.message;msg.style.color="#ef4444"}};</script></body></html>
