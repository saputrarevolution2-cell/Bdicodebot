<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#080b19">
<meta name="description" content="TeleCod PasteLink">
<title>TeleCod PasteLink</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
<link rel="stylesheet" href="css/style.css?v=20260825-clean">
<script src="/js/fee.js"></script>
<script src="/js/ui-state.js?v=20260825-clean"></script>
<link rel="stylesheet" href="/js/telecod-ui.css">
<script src="/js/telecod-ui.js?v=20260825-clean"></script>
<style>
:root{--p-bg:#070a17;--p-card:rgba(15,20,42,.82);--p-card2:#111735;--p-line:rgba(255,255,255,.09);--p-text:#f7f8ff;--p-muted:#9aa5c0;--p-accent:#8b5cf6;--p-accent2:#2563eb}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body.paste-page{margin:0;min-height:100vh;background:radial-gradient(circle at 10% 0%,rgba(124,58,237,.22),transparent 28%),radial-gradient(circle at 90% 10%,rgba(37,99,235,.18),transparent 28%),linear-gradient(180deg,#070a17,#050711);color:var(--p-text);font-family:Inter,system-ui,sans-serif}
.paste-wrap{width:min(1120px,100%);margin:auto;padding:18px 18px 60px}
.paste-top{position:sticky;top:12px;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:26px;padding:10px 12px;border:1px solid var(--p-line);border-radius:18px;background:rgba(8,11,25,.78);backdrop-filter:blur(20px);box-shadow:0 18px 50px rgba(0,0,0,.22)}
.paste-brand{display:inline-flex;align-items:center;gap:8px;color:#fff;text-decoration:none;font-weight:900;font-size:20px;letter-spacing:-.03em;white-space:nowrap}.paste-brand span{color:#a855f7}
.paste-tools{display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end}
.paste-tools button,.paste-tools a{min-height:38px;border:1px solid var(--p-line);background:#10162d;color:#e9edff;border-radius:10px;padding:0 11px;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:7px;cursor:pointer;font:600 12px Inter}
.paste-tools button:hover,.paste-tools a:hover{border-color:rgba(139,92,246,.7);transform:translateY(-1px)}
.paste-main{display:grid;grid-template-columns:minmax(0,1fr);gap:16px}
.paste-hero{position:relative;overflow:hidden;padding:30px;border:1px solid var(--p-line);border-radius:24px;background:linear-gradient(145deg,rgba(17,23,53,.95),rgba(10,14,31,.92));box-shadow:0 28px 90px rgba(0,0,0,.28)}
.paste-hero:after{content:"";position:absolute;width:220px;height:220px;right:-90px;top:-100px;border-radius:50%;background:rgba(139,92,246,.16);filter:blur(10px)}
.paste-kicker{display:inline-flex;align-items:center;gap:8px;padding:7px 10px;border:1px solid rgba(139,92,246,.28);border-radius:999px;background:rgba(139,92,246,.1);color:#c4b5fd;font-size:11px;font-weight:800;letter-spacing:.04em}
.paste-hero h1{position:relative;z-index:1;font-size:clamp(27px,4vw,46px);line-height:1.08;letter-spacing:-.045em;margin:16px 0 12px;word-break:break-word}
.paste-description{position:relative;z-index:1;margin:0;color:#b7c0d6;line-height:1.7;font-size:14px;max-width:780px}
.paste-meta{position:relative;z-index:1;display:flex;gap:8px;flex-wrap:wrap;margin-top:18px;color:var(--p-muted);font-size:11px}.paste-meta span{display:inline-flex;align-items:center;gap:6px;padding:7px 9px;border:1px solid var(--p-line);border-radius:9px;background:rgba(255,255,255,.025)}
.paste-tags{position:relative;z-index:1;display:flex;gap:6px;flex-wrap:wrap;margin-top:14px}.paste-tag{padding:6px 9px;border-radius:999px;background:rgba(124,58,237,.14);border:1px solid rgba(124,58,237,.22);color:#c4b5fd;font-size:10px;font-weight:700}
.paste-destination{position:relative;z-index:1;display:flex;align-items:center;gap:10px;margin-top:20px;padding:11px;border:1px solid var(--p-line);border-radius:13px;background:rgba(0,0,0,.15)}
.paste-destination input{min-width:0;flex:1;border:0;outline:0;background:transparent;color:#cbd5ff;font:12px ui-monospace,SFMono-Regular,Menlo,monospace}
.destination-btn{border:0;border-radius:9px;padding:9px 12px;background:linear-gradient(135deg,#7c3aed,#2563eb);color:#fff;text-decoration:none;font-size:11px;font-weight:800;white-space:nowrap}
.paste-content{overflow:hidden;border:1px solid var(--p-line);border-radius:22px;background:var(--p-card);box-shadow:0 20px 70px rgba(0,0,0,.2)}
.paste-content-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:13px 16px;border-bottom:1px solid var(--p-line);color:var(--p-muted);font-size:11px}
.paste-content-head b{color:#e9edff}.paste-content-inner{padding:30px;min-height:320px;font-size:15px;line-height:1.85;color:#e8ecfa;overflow-wrap:anywhere}
.paste-content-inner h1,.paste-content-inner h2,.paste-content-inner h3{line-height:1.2;color:#fff}.paste-content-inner a{color:#a78bfa;text-decoration:underline}.paste-content-inner img{display:block;max-width:100%;height:auto;margin:14px auto;border-radius:14px}.paste-content-inner blockquote{margin:18px 0;padding:12px 16px;border-left:3px solid #8b5cf6;background:rgba(139,92,246,.08);color:#cbd5e1;border-radius:0 10px 10px 0}.paste-content-inner pre{padding:18px;overflow:auto;border:1px solid #26304d;border-radius:13px;background:#070b16;color:#e7edff;font:13px/1.7 ui-monospace,SFMono-Regular,Menlo,monospace}.paste-content-inner code{font:13px ui-monospace,SFMono-Regular,Menlo,monospace;background:rgba(255,255,255,.06);padding:2px 5px;border-radius:5px}
.raw{display:none;margin:0;padding:22px;white-space:pre-wrap;overflow:auto;background:#050811;color:#dbe5ff;border-top:1px solid var(--p-line);font:12px/1.7 ui-monospace,SFMono-Regular,Menlo,monospace}.raw.show{display:block}.paste-content-inner.hidden-rich{display:none}
.paste-bottom{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:13px 16px;border-top:1px solid var(--p-line);color:#7f8ba7;font-size:10px}
.notice{padding:55px 24px;text-align:center;border:1px solid var(--p-line);border-radius:24px;background:var(--p-card)}.notice i{font-size:38px;color:#a78bfa;margin-bottom:15px}.notice h1{margin:0 0 8px;font-size:25px}.notice p{color:var(--p-muted);line-height:1.6}.notice a{display:inline-flex;margin-top:14px}
.loader{min-height:55vh;display:grid;place-items:center;text-align:center;color:var(--p-muted)}.loader div{display:grid;gap:10px}.loader i{font-size:28px;color:#a78bfa}
@media(max-width:700px){
  .paste-wrap{padding:10px 11px 40px}.paste-top{top:7px;margin-bottom:16px;border-radius:14px;padding:8px}.paste-brand{font-size:17px}.paste-tools{gap:5px}.paste-tools button,.paste-tools a{width:38px;height:38px;padding:0}.paste-tools span{display:none}
  .paste-hero{padding:21px 18px;border-radius:19px}.paste-hero h1{font-size:28px}.paste-description{font-size:13px}.paste-meta span{padding:6px 8px}
  .paste-destination{align-items:stretch;flex-direction:column}.paste-destination input{width:100%;min-height:34px}.destination-btn{width:100%;text-align:center}
  .paste-content{border-radius:18px}.paste-content-inner{padding:20px 17px;font-size:14px;line-height:1.75;min-height:250px}.paste-content-inner pre{padding:13px;font-size:11px}
}
@media print{
  body.paste-page{background:#fff;color:#111}.paste-top,.paste-destination,.paste-bottom,.paste-content-head{display:none!important}.paste-wrap{width:100%;padding:0}.paste-hero,.paste-content{border:0;box-shadow:none;background:#fff;color:#111}.paste-content-inner{color:#111;padding:0}
}
</style>
</head>
<body class="paste-page">
<div class="paste-wrap">
  <header class="paste-top">
    <a class="paste-brand" href="index.html"><i class="fa-solid fa-link"></i> TELE<span>COD</span></a>
    <div class="paste-tools">
      <button id="copyBtn" type="button" title="Copy content"><i class="fa-regular fa-copy"></i><span>Copy</span></button>
      <button id="rawBtn" type="button" title="Toggle raw"><i class="fa-solid fa-code"></i><span>Raw</span></button>
      <button id="printBtn" type="button" title="Print"><i class="fa-solid fa-print"></i><span>Print</span></button>
      <button id="shareBtn" type="button" title="Share"><i class="fa-solid fa-share-nodes"></i><span>Share</span></button>
      <a href="index.html" title="New Paste"><i class="fa-solid fa-plus"></i><span>New</span></a>
    </div>
  </header>
  <main id="app" class="paste-main">
    <div class="loader"><div><i class="fa-solid fa-spinner fa-spin"></i><b>Loading PasteLink...</b></div></div>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.min.js"></script>
<script src="js/config.js"></script>
<script src="js/config-compat.js"></script>
<script>
"use strict";
const params=new URLSearchParams(location.search);
const slug=(params.get("slug")||location.pathname.split("/").filter(Boolean).pop()||"").trim();
const app=document.getElementById("app");
const cfg=window.TELECOD_CONFIG||{};
const ready=Boolean(window.supabase&&cfg.SUPABASE_URL&&cfg.SUPABASE_ANON_KEY&&!/YOUR_|PROJECT\b|PUBLISHABLE|ANON[_-]?KEY/i.test(String(cfg.SUPABASE_URL)+" "+String(cfg.SUPABASE_ANON_KEY)));
const sb=ready?window.supabase.createClient(cfg.SUPABASE_URL,cfg.SUPABASE_ANON_KEY):null;
let paste=null;

const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
const attr=s=>esc(s);
const safeUrl=u=>{try{const x=new URL(String(u||""));return /^(https?:)$/i.test(x.protocol)?x.href:""}catch{return""}};

function fail(message){
  app.innerHTML=`<section class="notice"><i class="fa-solid fa-file-circle-xmark"></i><h1>PasteLink tidak tersedia</h1><p>${esc(message)}</p><a href="index.html" class="destination-btn"><i class="fa-solid fa-plus"></i>&nbsp; Buat Paste Baru</a></section>`;
  ["copyBtn","rawBtn","printBtn","shareBtn"].forEach(id=>{const b=document.getElementById(id);if(b)b.disabled=true});
}

function render(data,isLocal=false){
  paste=data;
  const safe=window.DOMPurify ? DOMPurify.sanitize(data.content_html||"",{
    USE_PROFILES:{html:true},ADD_ATTR:["target","rel"],FORBID_TAGS:["style","script","iframe","object","embed","form"]
  }) : esc(data.content_html||"");
  const destination=safeUrl(data.destination_url||"");
  document.title=`${data.title||"Untitled"} • TeleCod PasteLink`;
  app.innerHTML=`
    <article class="paste-hero">
      <span class="paste-kicker"><i class="fa-solid fa-link"></i> TeleCod PasteLink</span>
      <h1>${esc(data.title||"Untitled")}</h1>
      ${data.description?`<p class="paste-description">${esc(data.description)}</p>`:""}
      <div class="paste-meta">
        <span><i class="fa-regular fa-user"></i> ${esc(data.author_name||"Anonymous")}</span>
        ${data.created_at?`<span><i class="fa-regular fa-calendar"></i> ${new Date(data.created_at).toLocaleString("id-ID")}</span>`:""}
        <span><i class="fa-regular fa-eye"></i> ${Number(data.views||0).toLocaleString()} views</span>
        ${data.syntax&&data.syntax!=="auto"?`<span><i class="fa-solid fa-code"></i> ${esc(data.syntax)}</span>`:""}
        ${isLocal?`<span><i class="fa-solid fa-flask"></i> Preview</span>`:""}
      </div>
      ${(data.tags||[]).length?`<div class="paste-tags">${data.tags.map(x=>`<span class="paste-tag">#${esc(x)}</span>`).join("")}</div>`:""}
      ${destination?`<div class="paste-destination"><input readonly value="${attr(destination)}"><a class="destination-btn" href="${attr(destination)}" target="_blank" rel="noopener noreferrer"><i class="fa-solid fa-arrow-up-right-from-square"></i> Buka Link</a></div>`:""}
    </article>
    <section class="paste-content">
      <div class="paste-content-head"><b><i class="fa-solid fa-file-lines"></i> Content</b><span>/${esc(data.slug||slug)}</span></div>
      <div class="paste-content-inner" id="rich">${safe}</div>
      <pre class="raw" id="raw">${esc(data.content_html||"")}</pre>
      <div class="paste-bottom"><span>TeleCod PasteLink</span><span>${isLocal?"Local preview":"Public content"}</span></div>
    </section>`;
  if(data.show_raw===false)document.getElementById("rawBtn").style.display="none";
  if(data.allow_download===false)document.getElementById("copyBtn").style.display="none";
}

async function load(){
  if(!slug)return fail("Slug PasteLink tidak ditemukan.");
  try{
    const local=localStorage.getItem("telecod_demo_"+slug);
    if(local){
      const d=JSON.parse(local);
      render(d,true);
      return;
    }
  }catch{}

  if(!sb)return fail("Supabase belum dikonfigurasi.");
  const {data,error}=await sb.from("pastelinks")
    .select("id,slug,title,author_name,description,tags,content_html,destination_url,visibility,created_at,expires_at,syntax,views,allow_download,show_raw")
    .eq("slug",slug).maybeSingle();
  if(error||!data)return fail("Paste tidak ditemukan atau sudah tidak tersedia.");
  if(data.visibility==="private")return fail("Paste ini private.");
  if(data.expires_at&&new Date(data.expires_at)<=new Date())return fail("Paste ini sudah kedaluwarsa.");
  render(data,false);
  try{await sb.rpc("increment_paste_view",{p_slug:slug});}catch(e){console.warn("View counter:",e)}
}

document.getElementById("copyBtn").onclick=async()=>{
  if(!paste)return;
  const text=document.getElementById("rich")?.innerText||"";
  try{await navigator.clipboard.writeText(text)}
  catch{const ta=document.createElement("textarea");ta.value=text;document.body.appendChild(ta);ta.select();document.execCommand("copy");ta.remove()}
  document.getElementById("copyBtn").innerHTML='<i class="fa-solid fa-check"></i><span>Copied</span>';
  setTimeout(()=>document.getElementById("copyBtn").innerHTML='<i class="fa-regular fa-copy"></i><span>Copy</span>',1800);
};
document.getElementById("rawBtn").onclick=()=>{
  document.getElementById("raw")?.classList.toggle("show");
  document.getElementById("rich")?.classList.toggle("hidden-rich");
};
document.getElementById("printBtn").onclick=()=>window.print();
document.getElementById("shareBtn").onclick=async()=>{
  try{
    if(navigator.share) await navigator.share({title:paste?.title||"TeleCod PasteLink",url:location.href});
    else await navigator.clipboard.writeText(location.href);
  }catch{}
};
load().catch(e=>fail(e?.message||"Gagal memuat PasteLink."));
</script>
</body>
</html>
