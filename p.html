<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TeleCod Paste</title><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"><link rel="stylesheet" href="css/style.css"></head><body><main class="section paste-view"><a href="index.html" class="logo">TELE<span>COD</span></a><article id="pasteBox" class="paste-view-card"><div class="loading">Loading...</div></article></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.min.js"></script><script src="js/config.js"></script><script src="js/config-compat.js"></script><script>
const q=new URLSearchParams(location.search);const slug=q.get("slug")||location.pathname.split("/").filter(Boolean).pop();
const box=document.getElementById("pasteBox");const ready=window.supabase&&window.TELECOD_SUPABASE_URL&&!window.TELECOD_SUPABASE_URL.includes("YOUR_");const sb=ready?supabase.createClient(window.TELECOD_SUPABASE_URL,window.TELECOD_SUPABASE_ANON_KEY):null;
(async()=>{if(!sb){box.innerHTML="<h1>Supabase belum dikonfigurasi.</h1><p>Isi js/config.js lalu deploy ulang.</p>";return}
let {data,error}=await sb.from("pastelinks").select("title,author_name,content_html,visibility,created_at,views").eq("slug",slug).maybeSingle();
if(error||!data){box.innerHTML="<h1>Paste tidak ditemukan</h1><p>Link mungkin salah, private, atau sudah expired.</p>";return}
const safe=window.DOMPurify?DOMPurify.sanitize(data.content_html,{USE_PROFILES:{html:true}}):"";box.innerHTML='<header><h1>'+escapeHtml(data.title)+'</h1><small>'+escapeHtml(data.author_name||"Anonymous")+' • '+new Date(data.created_at).toLocaleString()+'</small></header><div class="paste-content">'+safe+'</div><footer>'+Number(data.views||0)+' views</footer>';
await sb.rpc("increment_paste_view",{p_slug:slug});
})();
function escapeHtml(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
</script></body></html>
