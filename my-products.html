<!DOCTYPE html>
<html lang="id">
<head><script>(()=>{try{const k='pastele-theme',m=localStorage.getItem(k)||'system',d=m==='dark'||(m==='system'&&matchMedia('(prefers-color-scheme: dark)').matches);document.documentElement.dataset.theme=d?'dark':'light';document.documentElement.dataset.themeMode=m;document.documentElement.classList.add(d?'theme-dark':'theme-light');document.documentElement.style.colorScheme=d?'dark':'light'}catch(e){}})();</script>
    <meta charset="utf-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1, viewport-fit=cover"
    >

    <meta
        name="theme-color"
        content="#f7fafc"
    >

    <meta
        name="description"
        content="Kelola semua produk, link, dan konten yang kamu buat di PasTele."
    >

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://cdn.jsdelivr.net">

    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <title>Produk Saya — PasTele</title>

    <!-- =========================
         CORE
    ========================== -->
    <!-- =========================
         FONT AWESOME
    ========================== -->
    <!-- =========================
         GLOBAL STYLES
    ========================== -->
    <!-- =========================
         PAGE STYLE
    ========================== -->
    <script>document.documentElement.classList.add("pastele-ready");</script><link rel="stylesheet" href="css/my-products.css?v=20260910-clean-ui"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer"><link rel="stylesheet" href="css/core.css?v=20260910-core-fix">
<link rel="stylesheet" href="css/navbar.css?v=20260910-navbar-final"></head>


<body class="app-page my-products-page">

    <!-- =========================
         NAVBAR
    ========================== -->
    <div id="navbar"></div>


    <!-- =========================
         MAIN
    ========================== -->
    <main>

        <section class="section my-products-section">

            <div class="container my-products-container">


                <!-- =========================
                     HEADER
                ========================== -->
                <header class="page-heading">

                    <div class="page-heading-copy">

                        <div class="badge page-badge">
                            <i class="fa-solid fa-boxes-stacked"></i>
                            <span>Produk Saya</span>
                        </div>

                        <h1>
                            Produk Saya
                        </h1>

                        <p class="muted">
                            Kelola semua link, produk, dan konten yang sudah kamu buat.
                        </p>

                    </div>


                    <a
                        href="create-product.html"
                        class="btn primary create-product-btn"
                    >
                        <i class="fa-solid fa-plus"></i>
                        <span>Buat Produk</span>
                    </a>

                </header>


                <!-- =========================
                     OVERVIEW
                ========================== -->
                <section
                    id="overview"
                    class="products-overview"
                    aria-label="Ringkasan produk"
                >


                    <!-- TOTAL -->
                    <div class="overview-card">

                        <span class="overview-icon">
                            <i class="fa-solid fa-layer-group"></i>
                        </span>

                        <div class="overview-content">

                            <small>
                                Total Konten
                            </small>

                            <strong id="totalCount">
                                —
                            </strong>

                        </div>

                    </div>


                    <!-- PUBLISHED -->
                    <div class="overview-card">

                        <span class="overview-icon">
                            <i class="fa-solid fa-circle-check"></i>
                        </span>

                        <div class="overview-content">

                            <small>
                                Published
                            </small>

                            <strong id="publishedCount">
                                —
                            </strong>

                        </div>

                    </div>


                    <!-- PAID -->
                    <div class="overview-card">

                        <span class="overview-icon">
                            <i class="fa-solid fa-tag"></i>
                        </span>

                        <div class="overview-content">

                            <small>
                                Paid
                            </small>

                            <strong id="paidCount">
                                —
                            </strong>

                        </div>

                    </div>


                    <!-- DRAFT -->
                    <div class="overview-card">

                        <span class="overview-icon">
                            <i class="fa-solid fa-file-circle-xmark"></i>
                        </span>

                        <div class="overview-content">

                            <small>
                                Draft
                            </small>

                            <strong id="draftCount">
                                —
                            </strong>

                        </div>

                    </div>

                </section>


                <!-- =========================
                     SEARCH + FILTER
                ========================== -->
                <section
                    class="products-toolbar"
                    aria-label="Filter produk"
                >


                    <!-- SEARCH -->
                    <div class="search-box">

                        <i class="fa-solid fa-magnifying-glass"></i>

                        <input
                            id="searchInput"
                            class="input"
                            type="search"
                            autocomplete="off"
                            placeholder="Cari judul, link, slug..."
                            aria-label="Cari produk"
                        >

                        <button
                            id="clearSearch"
                            class="search-clear hidden"
                            type="button"
                            aria-label="Hapus pencarian"
                            title="Hapus pencarian"
                        >
                            <i class="fa-solid fa-xmark"></i>
                        </button>

                    </div>


                    <!-- TYPE -->
                    <div class="filter-wrap">

                        <label
                            class="sr-only"
                            for="typeFilter"
                        >
                            Filter tipe
                        </label>

                        <select
                            id="typeFilter"
                            class="select"
                        >

                            <option value="all">
                                Semua tipe
                            </option>

                            <option value="pastelink">
                                PasteLink
                            </option>

                            <option value="paste">
                                Paste
                            </option>

                            <option value="code">
                                Code
                            </option>

                            <option value="channel">
                                Channel / Group
                            </option>

                            <option value="product">
                                Marketplace Product
                            </option>

                        </select>

                    </div>


                    <!-- STATUS -->
                    <div class="filter-wrap">

                        <label
                            class="sr-only"
                            for="statusFilter"
                        >
                            Filter status
                        </label>

                        <select
                            id="statusFilter"
                            class="select"
                        >

                            <option value="all">
                                Semua status
                            </option>

                            <option value="published">
                                Published
                            </option>

                            <option value="paid">
                                Paid
                            </option>

                            <option value="draft">
                                Draft
                            </option>

                        </select>

                    </div>

                </section>


                <!-- =========================
                     RESULT BAR
                ========================== -->
                <div class="result-bar">

                    <span id="resultInfo">
                        Memuat produk...
                    </span>


                    <button
                        id="refreshBtn"
                        class="btn btn-small"
                        type="button"
                        title="Refresh"
                    >

                        <i class="fa-solid fa-rotate"></i>

                        <span>
                            Refresh
                        </span>

                    </button>

                </div>


                <!-- =========================
                     PRODUCT CONTENT
                ========================== -->
                <div id="content">

                    <div class="loading-state">

                        <div class="loading-spinner">
                            <i class="fa-solid fa-spinner fa-spin"></i>
                        </div>

                        <strong>
                            Memuat produk...
                        </strong>

                        <span>
                            Mengambil data terbaru dari database.
                        </span>

                    </div>

                </div>

            </div>

        </section>

    </main>


    <!-- =========================
         TOAST
    ========================== -->
    <div id="toast"></div>


    <!-- =========================
         PAGE SCRIPT
    ========================== -->
    <!-- =========================
         FOOTER
    ========================== -->
    <script src="js/my-products.js?v=20260910-clean-ui"></script>
<script src="js/navbar.js?v=20260910-navbar-final"></script></body>
</html>
