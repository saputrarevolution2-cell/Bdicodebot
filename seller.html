<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sell — TeleCod</title><link rel="stylesheet" href="assets/app.css"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"></head><body><main class="auth-page"><div class="auth-card" style="width:min(700px,100%)"><a class="brand" href="dashboard.html"><span class="brandmark"><i class="fa-brands fa-telegram"></i></span><span>Tele<span>Cod</span></span></a><h1>Create Product</h1><p>Untuk menjual, kamu harus login. Data produk disimpan langsung ke Supabase.</p><div id="msg"></div><form id="f" class="form"><label>Title</label><input id="title" required maxlength="150"><label>Slug</label><input id="slug" required pattern="[a-z0-9-]{3,150}"><label>Category</label><select id="category"><option>Code</option><option>Bot</option><option>Media</option><option>Channel VIP</option><option>Template</option><option>Other</option></select><label>Description</label><textarea id="description" rows="7" required></textarea><label>Price (IDR)</label><input id="price" type="number" min="1000" step="1000" required><label>Delivery type</label><select id="delivery"><option value="digital">Digital content</option><option value="telegram_channel">Telegram Channel</option><option value="external">External link</option></select><label>Delivery URL / content reference</label><input id="delivery_url" placeholder="https://..."><label>Thumbnail URL (optional)</label><input id="thumb" type="url"><button class="btn primary">Publish Product</button></form></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="assets/config.js"></script><script>const s=supabase.createClient(TELECOD_CONFIG.SUPABASE_URL,TELECOD_CONFIG.SUPABASE_ANON_KEY);async function auth(){let {data:{user}}=await s.auth.getUser();if(!user)location.href="login.html"}auth();f.onsubmit=async e=>{e.preventDefault();msg.innerHTML="";let {data:{user}}=await s.auth.getUser();if(!user){location.href="login.html";return}let row={seller_id:user.id,title:title.value,slug:slug.value,category:category.value,description:description.value,price:Number(price.value),delivery_type:delivery.value,delivery_url:delivery_url.value||null,thumbnail_url:thumb.value||null,status:"published"};let {error}=await s.from("products").insert(row);if(error){msg.innerHTML='<div class="error">'+error.message+'</div>';return}msg.innerHTML='<div class="success">Product berhasil dipublish.</div>';f.reset()};</script></body></html>
