<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create Product — TeleCod</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Poppins:wght@600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"><link rel="stylesheet" href="assets/base.css"><link rel="stylesheet" href="seller.css"></head><body data-title-id="Buat Produk — TeleCod" data-title-en="Create Product — TeleCod"><main class="auth-page"><div class="auth-card seller-card"><div class="auth-top"><a class="brand" href="dashboard.html"><span class="brandmark"><i class="fa-brands fa-telegram"></i></span><span>Tele<span>Cod</span></span></a><button class="lang" data-lang-toggle data-lang-label>ID / EN">ID / EN</button></div><h1 data-i18n="title">Buat produk.</h1><p data-i18n="desc">Publish aset digitalmu dan bagikan link produk ke komunitas.</p><div id="msg"></div><form id="f" class="form"><label data-i18n="titleLabel">Judul</label><input id="title" required maxlength="150" data-i18n-placeholder="titlePlaceholder"><label data-i18n="slug">Slug</label><input id="slug" required pattern="[a-z0-9-]{3,150}" data-i18n-placeholder="slugPlaceholder"><label data-i18n="category">Kategori</label><select id="category"><option>Code</option><option>Bot</option><option>Media</option><option>Channel VIP</option><option>Template</option><option>Other</option></select><label data-i18n="description">Deskripsi</label><textarea id="description" rows="7" required data-i18n-placeholder="descriptionPlaceholder"></textarea><label data-i18n="price">Harga (IDR)</label><input id="price" type="number" min="1000" step="1000" required placeholder="10000"><label data-i18n="delivery">Tipe delivery</label><select id="delivery"><option value="digital" data-i18n="digital">Digital content</option><option value="telegram_channel" data-i18n="channel">Telegram Channel</option><option value="external" data-i18n="external">External link</option></select><label data-i18n="deliveryUrl">Delivery URL / content reference</label><input id="delivery_url" placeholder="https://..."><label data-i18n="thumbnail">Thumbnail URL (optional)</label><input id="thumb" type="url" data-i18n-placeholder="thumbnailPlaceholder"><button class="btn primary" type="submit"><i class="fa-solid fa-cloud-arrow-up"></i><span data-i18n="submit">Publish Product</span></button></form></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="assets/config.js"></script><script src="assets/core.js"></script><script src="seller.js"></script></body></html>
