<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="TeleCod PasteLink"><title>TeleCod Paste</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"><link rel="stylesheet" href="css/style.css"><style>
body.paste-page{background:#f5f7fb;color:#151a2b;font-family:Inter,system-ui}.paste-wrap{max-width:1120px;margin:auto;padding:22px 16px 60px}.paste-top{display:flex;align-items:center;gap:12px;justify-content:space-between;margin-bottom:22px}.paste-brand{font-weight:900;color:#171b2e;text-decoration:none;font-size:20px}.paste-brand span{color:#7c3aed}.paste-tools{display:flex;gap:7px;flex-wrap:wrap}.paste-tools button,.paste-tools a{height:38px;border:1px solid #d9deea;background:#fff;border-radius:9px;padding:0 11px;color:#2b3347;text-decoration:none;display:inline-flex;align-items:center;gap:7px;cursor:pointer}.paste-hero{background:#fff;border:1px solid #e2e6ef;border-radius:15px;padding:24px;box-shadow:0 12px 40px #18264b0c}.paste-hero h1{font-size:32px;line-height:1.2;margin:0 0 9px}.paste-meta{display:flex;gap:13px;flex-wrap:wrap;color:#788298;font-size:12px}.paste-tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:13px}.paste-tag{padding:5px 9px;background:#f0eafe;color:#6932c9;border-radius:999px;font-size:11px}.paste-content{margin-top:18px;background:#fff;border:1px solid #e2e6ef;border-radius:15px;overflow:hidden}.paste-content-inner{padding:28px;min-height:300px;font-size:15px;line-height:1.8}.paste-content-inner pre{background:#0d1220;color:#e7edff;padding:17px;border-radius:10px;overflow:auto}.paste-content-inner img{max-width:100%;height:auto;border-radius:10px}.paste-content-inner a{color:#5b21b6}.paste-bottom{display:flex;justify-content:space-between;gap:10px;padding:14px 18px;border-top:1px solid #e7eaf0;color:#7d879c;font-size:11px}.raw{display:none;white-space:pre-wrap;padding:20px;background:#0d1220;color:#e7edff;font:13px/1.7 ui-monospace,SFMono-Regular,Menlo,monospace}.raw.show{display:block}.notice{padding:30px;text-align:center;background:#fff;border:1px solid #e2e6ef;border-radius:15px}.notice i{font-size:34px;color:#7c3aed;margin-bottom:12px}.notice h1{font-size:24px}.loader{padding:70px;text-align:center;color:#7d879c}@media(max-width:650px){.paste-top{align-items:flex-start}.paste-tools{justify-content:flex-end}.paste-hero h1{font-size:24px}.paste-content-inner{padding:18px}}
</style>  <script src="/js/fee.js"></script>

<link rel="stylesheet" href="/js/telecod-ui.css"><script src="/js/telecod-ui.js"></script></head><body class="paste-page"><div class="paste-wrap"><header class="paste-top"><a class="paste-brand" href="index.html">TELE<span>COD</span></a><div class="paste-tools"><button id="copyBtn"><i class="fa-regular fa-copy"></i> Copy</button><button id="rawBtn"><i class="fa-solid fa-code"></i> Raw</button><button id="printBtn"><i class="fa-solid fa-print"></i> Print</button><button id="shareBtn"><i class="fa-solid fa-share-nodes"></i> Share</button><a href="index.html"><i class="fa-solid fa-plus"></i> New Paste</a></div></header><main id="app"><div class="loader"><i class="fa-solid fa-spinner fa-spin"></i> Loading paste...</div></main></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.min.js"></script><script src="js/config.js"></script><script src="js/config-compat.js"></script><script>
const q=new URLSearchParams(location.search),slug=q.get('slug')||location.pathname.split('/').filter(Boolean).pop(),app=document.getElementById('app');const ready=window.supabase&&window.TELECOD_SUPABASE_URL&&!window.TELECOD_SUPABASE_URL.includes('YOUR_');const sb=ready?supabase.createClient(window.TELECOD_SUPABASE_URL,window.TELECOD_SUPABASE_ANON_KEY):null;let paste=null;
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
(async()=>{if(!sb)return fail('Supabase belum dikonfigurasi.');const {data,error}=await sb.from('pastelinks').select('id,slug,title,author_name,description,tags,content_html,visibility,created_at,expires_at,syntax,views,allow_download,show_raw').eq('slug',slug).maybeSingle();if(error||!data)return fail('Paste tidak ditemukan atau sudah tidak tersedia.');paste=data;if(data.visibility==='private')return fail('Paste ini private.');if(data.expires_at&&new Date(data.expires_at)<=new Date())return fail('Paste ini sudah kedaluwarsa.');const safe=DOMPurify.sanitize(data.content_html,{USE_PROFILES:{html:true},ADD_ATTR:['target','rel']});document.title=(data.title||'Untitled')+' • TeleCod Paste';app.innerHTML=`<article class="paste-hero"><h1>${esc(data.title||'Untitled')}</h1><div class="paste-meta"><span><i class="fa-regular fa-user"></i> ${esc(data.author_name||'Anonymous')}</span><span><i class="fa-regular fa-calendar"></i> ${new Date(data.created_at).toLocaleString('id-ID')}</span><span><i class="fa-regular fa-eye"></i> ${Number(data.views||0).toLocaleString()} views</span>${data.syntax&&data.syntax!=='auto'?`<span><i class="fa-solid fa-code"></i> ${esc(data.syntax)}</span>`:''}</div>${data.description?`<p style="color:#68748a;margin:16px 0 0">${esc(data.description)}</p>`:''}${(data.tags||[]).length?`<div class="paste-tags">${data.tags.map(x=>`<span class="paste-tag">#${esc(x)}</span>`).join('')}</div>`:''}</article><section class="paste-content"><div class="paste-content-inner" id="rich">${safe}</div><pre class="raw" id="raw">${esc(data.content_html)}</pre><div class="paste-bottom"><span>TeleCod PasteLink</span><span>/${esc(data.slug)}</span></div></section>`;if(!data.show_raw)document.getElementById('rawBtn').style.display='none';if(!data.allow_download)document.getElementById('copyBtn').style.display='none';await sb.rpc('increment_paste_view',{p_slug:slug});})();
function fail(m){app.innerHTML=`<div class="notice"><i class="fa-solid fa-file-circle-xmark"></i><h1>Paste tidak tersedia</h1><p>${esc(m)}</p><a href="index.html" class="purple-btn">Buat Paste Baru</a></div>`}
document.getElementById('copyBtn').onclick=async()=>{if(!paste)return;await navigator.clipboard.writeText(document.getElementById('rich')?.innerText||'');document.getElementById('copyBtn').innerHTML='<i class="fa-solid fa-check"></i> Copied'};document.getElementById('rawBtn').onclick=()=>{document.getElementById('raw')?.classList.toggle('show');document.getElementById('rich')?.classList.toggle('raw-hidden')};document.getElementById('printBtn').onclick=()=>window.print();document.getElementById('shareBtn').onclick=async()=>{try{if(navigator.share)await navigator.share({title:paste?.title||'TeleCod Paste',url:location.href});else await navigator.clipboard.writeText(location.href)}catch{}};
</script></body></html>
