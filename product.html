<!DOCTYPE html>
<html lang="id">
<head><script>(()=>{try{const k='pastele-theme',m=localStorage.getItem(k)||'system',d=m==='dark'||(m==='system'&&matchMedia('(prefers-color-scheme: dark)').matches);document.documentElement.dataset.theme=d?'dark':'light';document.documentElement.dataset.themeMode=m;document.documentElement.classList.add(d?'theme-dark':'theme-light');document.documentElement.style.colorScheme=d?'dark':'light'}catch(e){}})();</script>
    <meta charset="utf-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1, viewport-fit=cover"
    >

    <meta
        name="description"
        content="Detail produk dan akses PasTele."
    >

    <meta name="theme-color" content="#ffffff">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <title>Product — PasTele</title>

    <!-- =====================================================
         SUPABASE
         ===================================================== -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- =====================================================
         CORE
         ===================================================== -->
    
    <!-- =====================================================
         ICONS
         ===================================================== -->
    <!-- =====================================================
         GLOBAL STYLES
         ===================================================== -->
    <!-- =====================================================
         PUBLIC VIEW
         ===================================================== -->
    <!-- =====================================================
         PRODUCT
         ===================================================== -->
    <!-- =====================================================
         FINAL SAAS POLISH
         ===================================================== -->
    <script>document.documentElement.classList.add("pastele-ready");</script><link rel="stylesheet" href="css/product.css?v=20260910-clean-ui"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer"><link rel="stylesheet" href="css/core.css?v=20260910-core-fix">
<link rel="stylesheet" href="css/navbar.css?v=20260911-navbar-clean"><link rel="stylesheet" href="css/final-polish.css?v=20260911-final">
</head>

<body class="app-page product-page">

  <div id="navbar"></div>

    <!-- =====================================================
         PUBLIC NAVBAR
         ===================================================== -->
    <div id="publicNavbar"></div>


    <!-- =====================================================
         MAIN
         ===================================================== -->
    <main id="main-content">

        <section class="section product-section">

            <div class="container product-container">

                <!-- =================================================
                     PRODUCT HEADER
                     ================================================= -->
                <header class="product-page-header">

                    <div class="product-badge badge">
                        <i
                            class="fa-solid fa-cube"
                            aria-hidden="true"
                        ></i>

                        <span>Product</span>
                    </div>

                    <h1 class="product-page-title">
                        Product
                    </h1>

                    <p class="muted product-page-subtitle">
                        Detail produk dan akses.
                    </p>

                </header>


                <!-- =================================================
                     PRODUCT CONTENT
                     ================================================= -->
                <div
                    class="card product-content-card"
                    id="content"
                    aria-live="polite"
                    aria-busy="true"
                >

                    <div class="empty product-loading">

                        <i
                            class="fa-solid fa-spinner fa-spin"
                            aria-hidden="true"
                        ></i>

                        <span>
                            Memuat data produk...
                        </span>

                    </div>

                </div>


                <!-- =================================================
                     SOCIAL / ENGAGEMENT
                     Like + Comment untuk semua pengunjung
                     ================================================= -->
                <section
                    class="product-engagement"
                    id="productEngagement"
                    aria-label="Interaksi produk"
                >

                    <!-- =============================================
                         LIKE BAR
                         ============================================= -->
                    <div class="product-social-bar">

                        <button
                            type="button"
                            class="product-like-button"
                            id="productLikeBtn"
                            aria-label="Sukai produk"
                            aria-pressed="false"
                        >

                            <i
                                class="fa-regular fa-heart"
                                id="productLikeIcon"
                                aria-hidden="true"
                            ></i>

                            <span
                                class="product-like-label"
                                id="productLikeLabel"
                            >
                                Suka
                            </span>

                            <span
                                class="product-like-count"
                                id="productLikeCount"
                            >
                                0
                            </span>

                        </button>


                        <button type="button" class="product-share-button" id="productShareBtn" aria-label="Bagikan produk">
                            <i class="fa-solid fa-share-nodes" aria-hidden="true"></i>
                            <span>Bagikan</span>
                            <span class="product-share-count" id="productShareCount">0</span>
                        </button>


                        <div class="product-comment-summary">

                            <i
                                class="fa-regular fa-comment"
                                aria-hidden="true"
                            ></i>

                            <span id="productCommentCount">
                                0
                            </span>

                            <span>
                                Komentar
                            </span>

                        </div>

                    </div>


                    <!-- =============================================
                         COMMENTS
                         ============================================= -->
                    <div
                        class="product-comments card"
                        id="productComments"
                    >

                        <div class="product-comments-header">

                            <div>
                                <span class="product-comments-badge">
                                    <i
                                        class="fa-regular fa-comments"
                                        aria-hidden="true"
                                    ></i>

                                    Komentar
                                </span>

                                <h2>
                                    Apa pendapat kamu?
                                </h2>

                                <p class="muted">
                                    Siapa pun bisa memberikan komentar.
                                    Tidak perlu login.
                                </p>
                            </div>

                        </div>


                        <!-- =========================================
                             COMMENT FORM
                             ========================================= -->
                        <form
                            id="productCommentForm"
                            class="product-comment-form"
                            autocomplete="off"
                        >

                            <div class="product-comment-field">

                                <label for="commentName">
                                    Nama
                                </label>

                                <input
                                    type="text"
                                    id="commentName"
                                    name="name"
                                    maxlength="50"
                                    placeholder="Nama kamu"
                                    autocomplete="name"
                                    required
                                >

                            </div>


                            <div class="product-comment-field">

                                <label for="commentText">
                                    Komentar
                                </label>

                                <textarea
                                    id="commentText"
                                    name="comment"
                                    rows="4"
                                    maxlength="500"
                                    placeholder="Tulis komentar kamu..."
                                    required
                                ></textarea>

                                <div class="product-comment-counter">
                                    <span id="commentCharCount">
                                        0
                                    </span>
                                    / 500
                                </div>

                            </div>


                            <div class="product-comment-actions">

                                <button
                                    type="submit"
                                    class="btn btn-primary"
                                    id="productCommentSubmit"
                                >

                                    <i
                                        class="fa-solid fa-paper-plane"
                                        aria-hidden="true"
                                    ></i>

                                    <span>
                                        Kirim Komentar
                                    </span>

                                </button>

                            </div>

                        </form>


                        <!-- =========================================
                             COMMENT LIST
                             ========================================= -->
                        <div
                            class="product-comment-list"
                            id="productCommentList"
                            aria-live="polite"
                        >

                            <div
                                class="product-comments-loading"
                                id="productCommentsLoading"
                            >

                                <i
                                    class="fa-solid fa-spinner fa-spin"
                                    aria-hidden="true"
                                ></i>

                                <span>
                                    Memuat komentar...
                                </span>

                            </div>

                        </div>

                    </div>

                </section>

            </div>

        </section>

    </main>


    <!-- =====================================================
         TOAST
         ===================================================== -->
    <div
        id="toast"
        role="status"
        aria-live="polite"
        aria-atomic="true"
    ></div>


    <!-- =====================================================
         PRODUCT SCRIPT
         ===================================================== -->
    <!-- =====================================================
         FOOTER
         ===================================================== -->
    <script src="js/product.js?v=20260910-clean-ui"></script>
<script src="js/navbar.js?v=20260911-navbar-clean"></script></body>
</html>
