<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Product — TeleCod</title><link rel="stylesheet" href="assets/app.css"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"></head><body><header class="topbar"><div class="wrap nav"><a class="brand" href="index.html"><span class="brandmark"><i class="fa-brands fa-telegram"></i></span><span>Tele<span>Cod</span></span></a></div></header><main class="section"><div class="wrap"><div id="view" class="auth-card" style="width:100%"><div class="loading">Loading...</div></div></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="assets/config.js"></script><script>const s=supabase.createClient(TELECOD_CONFIG.SUPABASE_URL,TELECOD_CONFIG.SUPABASE_ANON_KEY);const slug=new URLSearchParams(location.search).get("slug");async function go(){let {data,error}=await s.from("products").select("id,title,description,price,category,thumbnail_url,seller_id,delivery_type").eq("slug",slug).eq("status","published").single();if(error){view.innerHTML='<div class="error">Product tidak ditemukan.</div>';return}view.innerHTML=`${data.thumbnail_url?`<img src="${escapeHtml(data.thumbnail_url)}" style="width:100%;max-height:400px;object-fit:cover;border-radius:18px">`:''}<span class="kicker">${escapeHtml(data.category||"Digital")}</span><h1 style="font:800 36px Poppins">${escapeHtml(data.title)}</h1><p style="color:#91a2b5;line-height:1.8">${escapeHtml(data.description||"")}</p><h2>${money(data.price)}</h2><button class="btn primary" onclick="buy('${data.id}')"><i class="fa-solid fa-cart-shopping"></i> Buy Now</button><div id="msg" style="margin-top:15px"></div>`}async function buy(id){let {data:{user}}=await s.auth.getUser();if(!user){location.href="login.html?next="+encodeURIComponent(location.href);return}let {data,error}=await s.from("orders").insert({product_id:id,buyer_id:user.id,amount:0,status:"pending"}).select().single();if(error){msg.innerHTML='<div class="error">'+error.message+'</div>';return}location.href="checkout.html?id="+data.id}go()</script><script src="assets/app.js"></script></body></html>
