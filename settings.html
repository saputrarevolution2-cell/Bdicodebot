<!doctype html><html lang="id"><head><script src="js/theme-preload.js"></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/js/config.js?v=20260831"></script><script src="/js/supabase.js?v=20260831"></script><script src="/js/auth.js"></script><script src="/js/navbar.js?v=20260903-fix"></script><title>Settings — PasTele</title><link rel="stylesheet" href="css/ui-system.css?v=20260903-final"><link rel="stylesheet" href="css/Settings.css?v=20260903-final"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"></head><body class="app-page"><div id="navbar"></div><main><section class="section"><div class="container"><span class="badge"><i class="fa-solid fa-gear"></i> SETTINGS</span><h1>Pengaturan akun</h1><div class="settings-grid">
<div class="card"><h2><i class="fa-solid fa-user"></i> Profil</h2><form id="profileForm" class="list"><label>Username<input class="input" id="username" required></label><label>Username Telegram<input class="input" id="telegram_username" placeholder="@username"></label><label>No. WhatsApp aktif<input class="input" id="whatsapp_number" placeholder="+62..."></label><label>Bio<textarea class="input" id="bio"></textarea></label><button class="btn primary"><i class="fa-solid fa-floppy-disk"></i> Simpan profil</button></form></div>
<div class="card"><h2><i class="fa-solid fa-lock"></i> Password</h2><form id="passForm" class="list"><div class="password-row"><input class="input" id="newpass" minlength="6" placeholder="Password baru" type="password"><button class="btn" type="button" data-toggle-pass="newpass"><i class="fa-solid fa-eye"></i></button></div><button class="btn primary"><i class="fa-solid fa-key"></i> Ubah password</button></form></div>
<div class="card payment-card"><h2><i class="fa-solid fa-money-check-dollar"></i> Payment / rekening penerimaan</h2><p class="muted">Pilih negara dan metode. Data tersimpan di database dan dapat dipakai saat withdraw.</p><form id="payForm" class="list"><div class="pay-tabs"><button type="button" class="btn active" data-method="ewallet"><i class="fa-solid fa-wallet"></i> E-Wallet</button><button type="button" class="btn" data-method="bank"><i class="fa-solid fa-building-columns"></i> Bank</button></div><div class="grid grid-2"><select class="select" id="country"><option value="ID">Indonesia</option><option value="US">United States</option><option value="GB">United Kingdom</option><option value="SG">Singapore</option><option value="MY">Malaysia</option><option value="PH">Philippines</option><option value="TH">Thailand</option><option value="AU">Australia</option><option value="JP">Japan</option><option value="CA">Canada</option><option value="IN">India</option><option value="CN">China</option><option value="AE">United Arab Emirates</option><option value="OTHER">Other</option></select><select class="select" id="provider"></select></div><input class="input" id="pname" placeholder="Nama pemegang rekening / e-wallet" required><input class="input" id="pnumber" placeholder="Nomor rekening / e-wallet" required><button class="btn primary"><i class="fa-solid fa-circle-check"></i> Simpan payment</button></form><div id="savedPayments" class="saved-payments"></div></div>
<div class="card"><h2><i class="fa-solid fa-circle-info"></i> Akun</h2><div class="list"><div class="notice">Gmail: <b id="email"></b></div><button class="btn" id="adminBtn"><i class="fa-solid fa-shield-halved"></i> Panel Admin</button><button class="btn" id="logout"><i class="fa-solid fa-right-from-bracket"></i> Log out</button></div></div></div></div></section></main><div id="toast"></div><script src="js/Settings.js?v=20260903-fix"></script><script src="js/site-shell.js?v=20260903"></script></body></html>
