<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Register — TeleCod</title><link rel="stylesheet" href="css/global.css"><link rel="stylesheet" href="css/auth.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/supabase.js"></script><script src="js/auth.js"></script></head><body><main class="auth"><form id="form" class="card auth-box"><div class="auth-logo"><div class="brand">Tele<span class="glow">Cod</span></div><p class="muted">Buat akun baru</p></div><div class="field"><label>Username</label><input class="input" id="username" required></div><div class="field"><label>Nama</label><input class="input" id="display"></div><div class="field"><label>Email</label><input class="input" id="email" type="email" required></div><div class="field"><label>Kata sandi</label><div class="password-wrap"><input class="input" id="password" type="password" minlength="6" required><button type="button" class="toggle-pass">👁</button></div></div><div class="field"><label>Konfirmasi kata sandi</label><div class="password-wrap"><input class="input" id="confirm" type="password" required><button type="button" class="toggle-pass">👁</button></div></div><button class="btn primary" style="width:100%">Daftar</button><p class="muted" style="text-align:center">Sudah punya akun? <a class="glow" href="login.html">Masuk</a></p></form></main><div id="toast" class="toast hidden"></div><script>$('#form').onsubmit=e=>{e.preventDefault();if($('#password').value!==$('#confirm').value)return toast('Konfirmasi kata sandi tidak cocok');doRegister($('#email').value,$('#password').value,$('#username').value,$('#display').value).catch(e=>toast(e.message))}</script></body></html>
