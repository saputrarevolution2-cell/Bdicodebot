<!DOCTYPE html>
<html lang="id">
<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Daftar — TeleCod</title>

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Poppins:wght@500;600;700;800;900&display=swap"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    >

    <link
        rel="stylesheet"
        href="assets/css/auth.css"
    >

</head>

<body>

<div class="background-grid"></div>
<div class="stars"></div>

<div class="bg-glow glow-blue"></div>
<div class="bg-glow glow-purple"></div>
<div class="bg-glow glow-pink"></div>


<a href="index.html" class="back-home">

    <i class="fa-solid fa-arrow-left"></i>

    <span>Kembali ke TeleCod</span>

</a>


<main class="auth-wrapper">

    <div class="auth-container">


        <!-- BRAND -->

        <div class="auth-brand">

            <div class="auth-logo">

                <i class="fa-brands fa-telegram"></i>

            </div>

            <div>

                <strong>
                    Tele<span>Cod</span>
                </strong>

                <small>
                    Telegram Bot Code Marketplace
                </small>

            </div>

        </div>


        <!-- CARD -->

        <div class="auth-card register-card">


            <div class="auth-header">

                <div class="auth-icon">

                    <i class="fa-solid fa-user-plus"></i>

                </div>

                <h1>Buat Akun</h1>

                <p>
                    Bergabung dengan komunitas
                    developer TeleCod.
                </p>

            </div>


            <button class="social-login">

                <i class="fa-brands fa-google"></i>

                <span>
                    Daftar dengan Google
                </span>

            </button>


            <div class="divider">
                <span>atau</span>
            </div>


            <form id="registerForm">


                <div class="form-row">

                    <div class="form-group">

                        <label>
                            <i class="fa-solid fa-user"></i>
                            Nama
                        </label>

                        <input
                            type="text"
                            id="name"
                            placeholder="Nama kamu"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label>
                            <i class="fa-solid fa-at"></i>
                            Username
                        </label>

                        <input
                            type="text"
                            id="username"
                            placeholder="username"
                            required
                        >

                    </div>

                </div>


                <div class="form-group">

                    <label>

                        <i class="fa-brands fa-telegram"></i>

                        Telegram ID

                    </label>

                    <input
                        type="text"
                        id="telegramId"
                        placeholder="Contoh: 123456789"
                        required
                    >

                    <small class="input-help">
                        Digunakan untuk verifikasi akun Telegram.
                    </small>

                </div>


                <div class="form-group">

                    <label>

                        <i class="fa-solid fa-envelope"></i>

                        Email

                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="email@example.com"
                        required
                    >

                </div>


                <div class="form-group">

                    <label>

                        <i class="fa-solid fa-lock"></i>

                        Password

                    </label>

                    <div class="input-wrapper">

                        <input
                            type="password"
                            id="password"
                            placeholder="Minimal 8 karakter"
                            required
                        >

                        <button
                            type="button"
                            class="password-toggle"
                            data-target="password"
                        >
                            <i class="fa-solid fa-eye"></i>
                        </button>

                    </div>

                </div>


                <div class="form-group">

                    <label>

                        <i class="fa-solid fa-lock"></i>

                        Konfirmasi Password

                    </label>

                    <div class="input-wrapper">

                        <input
                            type="password"
                            id="confirmPassword"
                            placeholder="Ulangi password"
                            required
                        >

                        <button
                            type="button"
                            class="password-toggle"
                            data-target="confirmPassword"
                        >
                            <i class="fa-solid fa-eye"></i>
                        </button>

                    </div>

                </div>


                <label class="terms">

                    <input
                        type="checkbox"
                        required
                    >

                    <span></span>

                    Saya menyetujui
                    <a href="#">
                        Terms of Service
                    </a>
                    dan
                    <a href="#">
                        Privacy Policy
                    </a>

                </label>


                <button
                    type="submit"
                    class="auth-submit"
                >

                    <span>Buat Akun</span>

                    <i class="fa-solid fa-arrow-right"></i>

                </button>


            </form>


            <div class="auth-register">

                Sudah punya akun?

                <a href="login.html">
                    Masuk sekarang
                </a>

            </div>

        </div>


        <div class="auth-security">

            <div>
                <i class="fa-solid fa-shield-halved"></i>
                Secure
            </div>

            <div>
                <i class="fa-solid fa-lock"></i>
                Protected
            </div>

            <div>
                <i class="fa-brands fa-telegram"></i>
                Telegram
            </div>

        </div>


        <p class="copyright">
            © 2026 TeleCod. All Rights Reserved.
        </p>

    </div>

</main>


<script src="assets/js/auth.js"></script>

</body>
</html>
