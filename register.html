<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Daftar — TeleCod</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="stylesheet" href="assets/css/register.css">
</head><body><main class="tc-auth"><section class="tc-auth-card"><div class="tc-auth-brand"><a class="tc-logo" href="index.html"><div class="tc-logo-icon"><i class="fa-brands fa-telegram"></i></div><div><strong>Tele<span>Cod</span></strong><small>Telegram Bot Code Marketplace</small></div></a><h1>Buat Akun</h1><p>Daftar dengan Gmail dan hubungkan identitas Telegram kamu.</p></div><div id="authAlert" class="tc-alert"></div><div class="tc-socials"><button class="tc-btn" id="telegramBtn"><i class="fa-brands fa-telegram"></i> Daftar Telegram</button><button class="tc-btn" id="googleBtn"><i class="fa-brands fa-google"></i> Daftar Gmail</button></div><div class="tc-auth-divider">atau daftar dengan email</div><form id="registerForm" class="tc-form"><div class="tc-field"><label>ID Telegram / Username Telegram</label><input id="telegram" placeholder="123456789 atau @username" required></div><div class="tc-field"><label>Gmail</label><input id="email" type="email" placeholder="nama@gmail.com" autocomplete="email" required></div><div class="tc-field"><label>Kata sandi</label><div style="display:flex;gap:8px"><input id="password" type="password" minlength="8" required style="flex:1"><button class="tc-iconbtn" type="button" data-password="password"><i class="fa-solid fa-eye"></i></button></div></div><div class="tc-field"><label>Konfirmasi kata sandi</label><div style="display:flex;gap:8px"><input id="confirm" type="password" minlength="8" required style="flex:1"><button class="tc-iconbtn" type="button" data-password="confirm"><i class="fa-solid fa-eye"></i></button></div></div><label style="display:flex;gap:9px;align-items:center;color:#8fa5c6;font-size:12px;margin-bottom:18px"><input type="checkbox" required> Saya menyetujui Terms & Privacy Policy.</label><button class="tc-btn primary" type="submit" style="width:100%"><i class="fa-solid fa-user-plus"></i> Daftar / Registrasi</button></form><p style="text-align:center;color:#8fa5c6;font-size:13px">Sudah punya akun? <a href="login.html" style="color:#20aaff">Masuk / Login</a></p></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/js/register.js"></script>
</body></html>
