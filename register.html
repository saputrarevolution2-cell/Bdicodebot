<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Register — TeleCod</title><link rel="stylesheet" href="assets/app.css"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"></head><body><main class="auth-page"><div class="auth-card"><a class="brand" href="index.html"><span class="brandmark"><i class="fa-brands fa-telegram"></i></span><span>Tele<span>Cod</span></span></a><h1>Create your account.</h1><p>Daftar untuk membeli atau menjual aset digital.</p><div id="msg"></div><form class="form" id="form"><label>Nama</label><input id="name" required maxlength="80"><label>Username</label><input id="username" required maxlength="32" pattern="[A-Za-z0-9_]{3,32}"><label>Email</label><input id="email" type="email" required><label>Password</label><input id="password" type="password" required minlength="8"><button class="btn primary" type="submit">Create Account <i class="fa-solid fa-user-plus"></i></button></form><p style="text-align:center">Sudah punya akun? <a style="color:#62ddff;font-weight:800" href="login.html">Login</a></p></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="assets/config.js"></script><script>const s=supabase.createClient(TELECOD_CONFIG.SUPABASE_URL,TELECOD_CONFIG.SUPABASE_ANON_KEY);form.onsubmit=async e=>{e.preventDefault();msg.innerHTML="";const {data,error}=await s.auth.signUp({email:email.value,password:password.value,options:{data:{display_name:name.value,username:username.value}}});if(error){msg.innerHTML='<div class="error">'+error.message+'</div>';return}msg.innerHTML='<div class="success">Akun berhasil dibuat. Jika email confirmation aktif, cek email lalu login.</div>'};</script></body></html>
