<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >
  <meta name="color-scheme" content="light dark">
  <!-- =====================================================
       THEME PRELOAD
       ===================================================== -->
  <script src="js/theme-preload.js"></script>
  <!-- =====================================================
       FONTS
       ===================================================== -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <!-- =====================================================
       SUPABASE
       ===================================================== -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <title>Register — PasTele</title>
  <!-- =====================================================
       CORE CONFIGURATION
       ===================================================== -->
  <script src="/js/config.js?v=20260831"></script>
  <script src="/js/supabase.js?v=20260831"></script>
  <!-- =====================================================
       AUTHENTICATION
       ===================================================== -->
  <script src="/js/debug-panel.js"></script>
  <script src="/js/auth.js"></script>
  <!-- =====================================================
       FONT AWESOME
       ===================================================== -->
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
  >
  <!-- =====================================================
       STYLES
       ===================================================== -->
  <link
    rel="stylesheet"
    href="css/app.css?v=20260904"
  >
  <link rel="stylesheet" href="css/navbar.css?v=20260905">
  <link rel="stylesheet" href="css/footer.css?v=20260905">
  <link
    rel="stylesheet"
    href="css/register.css?v=20260904"
  >
</head>
<body>
  <main class="auth-shell">
    <div class="card auth-card">
      <!-- =================================================
           LOGO
           ================================================= -->
      <div class="auth-logo" aria-hidden="true">
        <i class="fa-solid fa-user-plus"></i>
      </div>
      <!-- =================================================
           TITLE
           ================================================= -->
      <h1>Buat akun PasTele</h1>
      <p class="muted">
        Mulai publish, share, dan monetize konten digital kamu.
      </p>
      <!-- =================================================
           AUTH ERROR
           ================================================= -->
      <div
        class="auth-error hidden"
        id="authError"
        role="alert"
        aria-live="polite"
      ></div>
      <!-- =================================================
           AUTH NOTICE
           ================================================= -->
      <div
        class="notice hidden"
        id="authNotice"
        role="status"
        aria-live="polite"
      ></div>
      <!-- =================================================
           REGISTER PROGRESS
           ================================================= -->
      <div
        class="auth-progress"
        aria-label="Kelengkapan formulir"
      >
        <i id="regProgress"></i>
      </div>
      <!-- =================================================
           REGISTER FORM
           ================================================= -->
      <form
        class="list"
        id="reg"
        autocomplete="on"
        novalidate
      >
        <!-- Username -->
        <div class="field">
          <label for="username">
            Username
          </label>
          <input
            id="username"
            name="username"
            class="input"
            type="text"
            autocomplete="username"
            maxlength="32"
            minlength="3"
            pattern="[A-Za-z0-9_]+"
            autocapitalize="none"
            autocorrect="off"
            spellcheck="false"
            placeholder="username"
            required
          >
        </div>
        <!-- Email -->
        <div class="field">
          <label for="email">
            Email
          </label>
          <input
            id="email"
            name="email"
            class="input"
            type="email"
            autocomplete="email"
            inputmode="email"
            autocapitalize="none"
            autocorrect="off"
            spellcheck="false"
            placeholder="nama@email.com"
            required
          >
        </div>
        <!-- Password -->
        <div class="field">
          <label for="password">
            Kata sandi
          </label>
          <div class="row">
            <input
              id="password"
              name="password"
              class="input"
              type="password"
              autocomplete="new-password"
              minlength="6"
              placeholder="Minimal 6 karakter"
              required
            >
            <button
              class="btn toggle"
              id="togglePassword"
              type="button"
              data-t="password"
              aria-label="Tampilkan kata sandi"
              title="Tampilkan kata sandi"
            >
              <i class="fa-solid fa-eye" aria-hidden="true"></i>
            </button>
          </div>
        </div>
        <!-- Confirm Password -->
        <div class="field">
          <label for="confirm">
            Konfirmasi kata sandi
          </label>
          <div class="row">
            <input
              id="confirm"
              name="confirm"
              class="input"
              type="password"
              autocomplete="new-password"
              minlength="6"
              placeholder="Ulangi kata sandi"
              required
            >
            <button
              class="btn toggle"
              id="toggleConfirm"
              type="button"
              data-t="confirm"
              aria-label="Tampilkan konfirmasi kata sandi"
              title="Tampilkan konfirmasi kata sandi"
            >
              <i class="fa-solid fa-eye" aria-hidden="true"></i>
            </button>
          </div>
        </div>
        <!-- Register -->
        <button
          class="btn primary"
          id="submit"
          type="submit"
        >
          <i
            class="fa-solid fa-user-plus"
            aria-hidden="true"
          ></i>
          <span>Register</span>
        </button>
      </form>
      <!-- =================================================
           GOOGLE REGISTER
           ================================================= -->
      <button
        class="btn page-style-1"
        id="google"
        type="button"
      >
        <i
          class="fa-brands fa-google"
          aria-hidden="true"
        ></i>
        <span>Daftar dengan Google</span>
      </button>
      <!-- =================================================
           FOOTER
           ================================================= -->
      <div class="auth-footer">
        <p class="muted page-style-2">
          <span>Sudah punya akun?</span>
          <a
            class="page-style-3"
            href="login.html"
          >
            <span>Login</span>
            <i
              class="fa-solid fa-arrow-right"
              aria-hidden="true"
            ></i>
          </a>
        </p>
        <a
          class="page-style-4"
          href="index.html"
        >
          <i
            class="fa-solid fa-arrow-left"
            aria-hidden="true"
          ></i>
          <span>Kembali</span>
        </a>
      </div>
    </div>
  </main>
  <!-- =====================================================
       REGISTER
       ===================================================== -->
  <script src="js/register.js?v=20260904"></script>
  <!-- =====================================================
       SITE SHELL
       ===================================================== -->
  <script src="js/footer.js?v=20260904"></script>
  <script src="js/navbar.js?v=20260905"></script>
</body>
</html>
