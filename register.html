<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Register — TeleCod</title>
<meta name="description" content="Buat akun TeleCod dengan email, Google, atau Telegram.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Poppins:wght@600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
<link rel="stylesheet" href="assets/base.css"><link rel="stylesheet" href="register.css">
<link rel="stylesheet" href="assets/theme.css"></head>
<body data-title-id="Daftar — TeleCod" data-title-en="Register — TeleCod">
<main class="auth-page">
<div class="auth-card">
  <div class="auth-top">
    <a class="brand" href="index.html"><span class="brandmark"><i class="fa-brands fa-telegram"></i></span><span>Tele<span>Cod</span></span></a>
    <button class="lang" data-lang-toggle data-lang-label>ID / EN">ID / EN</button>
  </div>
  <h1 data-i18n="title">Buat akunmu 🚀</h1>
  <p data-i18n="desc">Daftar dengan email, Google, atau Telegram lalu mulai membuat PasteLink dan menjual aset digital.</p>
  <div id="msg"></div>
  <div class="social-auth">
    <button class="btn google-btn" id="googleRegister"><i class="fa-brands fa-google"></i><span data-i18n="google">Daftar dengan Google</span></button>
    <div class="telegram-login-box">
      <div class="social-label"><i class="fa-brands fa-telegram"></i><span data-i18n="telegram">Daftar dengan Telegram</span></div>
      <div id="telegramRegister"></div>
    </div>
  </div>
  <div class="or"><span data-i18n="or">atau daftar manual</span></div>
  <form class="form" id="form">
    <label data-i18n="name">Nama</label>
    <input id="name" required maxlength="80" data-i18n-placeholder="namePlaceholder">
    <label data-i18n="username">Username Telegram / Username</label>
    <input id="username" required maxlength="32" pattern="[A-Za-z0-9_]{3,32}" data-i18n-placeholder="usernamePlaceholder">
    <label data-i18n="email">Gmail / Email</label>
    <input id="email" type="email" required autocomplete="email" data-i18n-placeholder="emailPlaceholder">
    <label data-i18n="password">Password</label>
    <input id="password" type="password" required minlength="8" autocomplete="new-password" data-i18n-placeholder="passwordPlaceholder">
    <button class="btn primary" type="submit"><span data-i18n="submit">Buat Akun</span><i class="fa-solid fa-user-plus"></i></button>
  </form>
  <p class="form-note"><span data-i18n="hasAccount">Sudah punya akun?</span> <a href="login.html" data-i18n="login">Login</a></p>
</div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/config.js"></script><script src="assets/core.js"></script><script src="register.js"></script>
</body></html>
