<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Withdrawals</title><link rel="stylesheet" href="css/global.css"><link rel="stylesheet" href="css/navbar.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/supabase.js"></script><script src="js/auth.js"></script><script src="js/navbar.js"></script><script src="js/withdrawals.js" defer></script></head><body><div id="navbar"></div><main class="section"><div class="container"><h1>Withdrawals</h1><form id="withdrawForm" class="card" style="padding:20px;margin-bottom:20px"><div class="grid grid-2"><input class="input" name="amount" type="number" min="1" placeholder="Nominal" required><select class="select" name="mode"><option value="regular">Regular</option><option value="instant">Instant</option></select><input class="input" name="method" placeholder="Metode (BCA/DANA/OVO...)" required><input class="input" name="name" placeholder="Nama rekening" required><input class="input" name="number" placeholder="Nomor rekening" required></div><button class="btn primary" style="margin-top:15px">Ajukan</button></form><div class="card table-wrap"><table class="table"><thead><tr><th>Date</th><th>Amount</th><th>Method</th><th>Mode</th><th>Status</th><th>Note</th></tr></thead><tbody id="rows"></tbody></table></div></div></main><div id="toast" class="toast hidden"></div></body></html>
