<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PasTele — Database Setup</title><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"><style>body{margin:0;background:#f7f9fb;color:#17212b;font:15px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.box{max-width:620px;margin:8vh auto;padding:28px;background:#fff;border:1px solid #e6ebef;border-radius:24px;box-shadow:0 18px 55px #10203012}.mark{width:48px;height:48px;border-radius:15px;background:#eaf5ff;color:#3390ec;display:grid;place-items:center;font-size:22px}.input{width:100%;box-sizing:border-box;padding:13px 14px;border:1px solid #dce4ea;border-radius:12px;margin:7px 0 16px}.btn{padding:12px 17px;border-radius:12px;border:1px solid #dce4ea;background:#fff;font-weight:750}.primary{background:#3390ec;color:#fff;border-color:#3390ec}.notice{padding:13px;border-radius:12px;background:#eef8ff;color:#287dcc;margin:15px 0}.muted{color:#718096}code{background:#f1f4f7;padding:2px 5px;border-radius:5px}</style></head><body><div class="box"><div class="mark"><i class="fa-brands fa-telegram"></i></div><h1>Hubungkan PasTele ke Supabase</h1><p class="muted">Masukkan Project URL dan anon/public key. Keduanya aman digunakan di browser; jangan pernah memasukkan service-role key.</p><label>Supabase Project URL</label><input id="url" class="input" placeholder="https://xxxxx.supabase.co"><label>Anon / Publishable Key</label><input id="key" class="input" placeholder="sb_publishable_... / anon key"><button id="save" class="btn primary"><i class="fa-solid fa-plug"></i> Simpan & tes koneksi</button> <a class="btn" href="index.html">Kembali</a><div id="out"></div><hr style="border:0;border-top:1px solid #edf0f2;margin:25px 0"><p class="muted"><b>Database:</b> jalankan <code>supabase/schema.sql</code> di Supabase SQL Editor setelah membuat project.</p></div><script>const url=document.getElementById('url'),key=document.getElementById('key'),out=document.getElementById('out');url.value=localStorage.getItem('TC_SUPABASE_URL')||'';key.value=localStorage.getItem('TC_SUPABASE_ANON_KEY')||'';save.onclick=async()=>{if(!/^https:\/\//.test(url.value.trim())||!key.value.trim()){out.innerHTML='<div class="notice">URL dan key wajib diisi.</div>';return}localStorage.setItem('TC_SUPABASE_URL',url.value.trim());localStorage.setItem('TC_SUPABASE_ANON_KEY',key.value.trim());try{const s=window.supabase.createClient(url.value.trim(),key.value.trim());const {error}=await s.rpc('resolve_username_login',{p_username:'__connection_test__'});if(error&&error.code!=='PGRST202'&&error.code!=='42883')throw error;out.innerHTML='<div class="notice">Koneksi tersimpan. <a href="index.html">Buka PasTele</a>.</div>'}catch(e){out.innerHTML='<div class="notice" style="color:#b42318;background:#fff2f0">Key tersimpan, tetapi RPC belum siap: '+String(e.message||e)+'</div>'}};</script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></body></html>
