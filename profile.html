<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Profile</title><link rel="stylesheet" href="css/global.css"><link rel="stylesheet" href="css/navbar.css"><link rel="stylesheet" href="css/profile.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/supabase.js"></script><script src="js/auth.js"></script><script src="js/navbar.js"></script></head><body><div id="navbar"></div><main class="section"><div class="container"><div class="card" style="padding:25px"><div class="row"><img id="avatar" class="avatar"><div><h2 id="name">Profile</h2><p id="user" class="muted"></p></div></div><form id="form" style="margin-top:25px"><div class="field"><label>Display name</label><input id="display" class="input"></div><div class="field"><label>Bio</label><textarea id="bio" class="textarea"></textarea></div><button class="btn primary">Simpan</button></form></div></div></main><div id="toast" class="toast hidden"></div><script>(async()=>{const p=await profile();if(!p){location.href='login.html';return}$('#name').textContent=p.display_name||p.username;$('#user').textContent='@'+p.username;$('#avatar').src=p.avatar_url||'https://api.dicebear.com/9.x/identicon/svg?seed='+encodeURIComponent(p.username);$('#display').value=p.display_name||'';$('#bio').value=p.bio||'';$('#form').onsubmit=async e=>{e.preventDefault();const {error}=await sb.from('profiles').update({display_name:$('#display').value,bio:$('#bio').value}).eq('id',p.id);toast(error?.message||'Profil disimpan')};})()</script></body></html>
